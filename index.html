// ============================================================================
const Dice = {
  roll(pool, tn, critOn = 6) {
    pool = Math.max(1, Math.round(pool)); tn = U.clamp(tn, 2, 6);
    const dice = []; let hits = 0, crits = 0;
    for (let i = 0; i < pool; i++) {
      const d = 1 + Math.floor(Math.random() * 6);
      const crit = d >= critOn; const hit = d >= tn || crit;
      if (hit) hits++; if (crit) crits++;
      dice.push({ d, hit, crit });
    }
    return { dice, hits, crits, pool, tn };
  },
  html(r) {
    return '<span class="dice">' + r.dice.map((x, i) => `<span class="die ${x.crit ? 'crit' : x.hit ? 'hit' : ''}" style="animation-delay:${i * 60}ms">${x.d}</span>`).join('') + `</span> <span class="dim">TN${r.tn}</span>`;
  },
};

// ============================================================================
// GameEngine: seeded galaxy, deterministic timestamp economy, world state
// ============================================================================
const GameEngine = {
  galaxy: null, state: null, bulletins: [], seen: new Set(), saveTimer: null, unread: 0,

  // ---------- Galaxy generation (pure function of the 32-bit sector seed) ----------
  generateGalaxy(seed) {
    seed >>>= 0;
    const r = U.rng(seed, 'galaxy'); const W = 1000, H = 640, N = 34;
    const systems = []; let tries = 0;
    while (systems.length < N && tries < 8000) {
      tries++;
      const x = 55 + r() * (W - 110), y = 45 + r() * (H - 90);
      if (systems.every(s => Math.hypot(s.x - x, s.y - y) > 80)) systems.push({ id: systems.length, x, y });
    }
    const homes = [Math.floor(r() * systems.length)];
    while (homes.length < FACTIONS.length) {
      let best = 0, bd = -1;
      systems.forEach(s => { const d = Math.min(...homes.map(h => Math.hypot(systems[h].x - s.x, systems[h].y - s.y))); if (d > bd) { bd = d; best = s.id; } });
      homes.push(best);
    }
    const strength = FACTIONS.map(() => 0.8 + r() * 0.5);
    const names = new Set();
    const sysName = () => {
      for (let k = 0; k < 50; k++) {
        let s = ''; const n = U.ri(r, 2, 3);
        for (let i = 0; i < n; i++) s += U.pick(r, SYL);
        s = U.cap(s);
        if (r() < 0.22) s += ' ' + U.pick(r, ['Prime', 'Reach', 'Gate', 'Major', 'Minor', 'Deep', 'Hollow', 'Verge']);
        if (!names.has(s)) { names.add(s); return s; }
      }
      return 'Sector ' + names.size;
    };
    systems.forEach(s => {
      let bf = 0, bd = 1e9;
      homes.forEach((h, f) => { const d = Math.hypot(systems[h].x - s.x, systems[h].y - s.y) / strength[f]; if (d < bd) { bd = d; bf = f; } });
      s.faction = bf; s.home = homes.includes(s.id); s.name = sysName();
      s.star = U.pick(r, STAR_COLORS); s.starSize = 0.7 + r() * 0.6;
      s.dangerBase = (bf === 4 ? 3 : 1) + (r() < 0.3 ? 1 : 0);
      const np = s.home ? U.ri(r, 2, 4) : U.ri(r, 1, 4);
      s.planets = [];
      for (let i = 0; i < np; i++) {
        const type = U.ri(r, 0, PLANET_TYPES.length - 1);
        const T = PLANET_TYPES[type];
        const p = { id: i, name: s.name + ' ' + U.roman(i), type, size: 0.75 + r() * 0.25, seed: Math.floor(r() * 4294967296),
          market: r() < 0.85, shipyard: r() < 0.25, tavern: r() < 0.6, rings: T.gas ? r() < 0.7 : r() < 0.08, hue: r(), pop: Math.floor(Math.pow(r(), 2) * 9000) + 20 };
        const others = COMMODITIES.map(c => c.id).filter(c => !T.prod.includes(c) && !T.cons.includes(c) && c !== 9);
        const extra = [];
        for (let k = 0; k < 3; k++) extra.push(others.splice(Math.floor(r() * others.length), 1)[0]);
        p.marketList = Array.from(new Set([...T.prod, ...T.cons, ...extra])).filter(c => c !== 9 || bf === 4 || r() < 0.2);
        if (bf === 4 && !p.marketList.includes(9) && r() < 0.6) p.marketList.push(9);
        p.marketList.sort((a, b) => a - b);
        s.planets.push(p);
      }
      if (!s.planets.some(p => p.market)) s.planets[0].market = true;
      if (s.home) { s.planets[0].market = true; s.planets[0].shipyard = true; s.planets[0].tavern = true; }
    });
    const edges = new Set(); const key = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
    const inTree = new Set([0]);
    while (inTree.size < systems.length) {
      let best = null, bd = 1e9;
      for (const a of inTree) for (const b of systems) {
        if (inTree.has(b.id)) continue;
        const d = Math.hypot(systems[a].x - b.x, systems[a].y - b.y);
        if (d < bd) { bd = d; best = [a, b.id]; }
      }
      edges.add(key(best[0], best[1])); inTree.add(best[1]);
    }
    systems.forEach(s => {
      const near = systems.filter(o => o.id !== s.id).map(o => [o.id, Math.hypot(o.x - s.x, o.y - s.y)]).sort((a, b) => a[1] - b[1]);
      near.slice(0, 2).forEach(([o, d]) => { if (d < 175) edges.add(key(s.id, o)); });
    });
    const lanes = Array.from(edges).map(k => k.split('-').map(Number));
    const adj = systems.map(() => []);
    lanes.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
    return { seed, systems, lanes, adj, homes, N: systems.length };
  },

  // ---------- Time engine ----------
  worldTime() { return U.now() + (this.state ? this.state.timeOffset : 0); },
  sys(id) { return this.galaxy.systems[id]; },
  here() { return this.galaxy.systems[this.state.system]; },
  herePlanet() { return this.here().planets[this.state.planet]; },
  dist(a, b) { const A = this.sys(a), B = this.sys(b); return Math.hypot(A.x - B.x, A.y - B.y); },
  fuelCost(a, b) { return Math.max(1, Math.ceil(this.dist(a, b) / 110)); },
  travelHours(a, b) { return Math.round((this.dist(a, b) / 45 + 2) * 10) / 10; },

  warIntensity(fa, fb, t) {
    if (fa === fb) return 0;
    const a = Math.min(fa, fb), b = Math.max(fa, fb);
    const r = U.rng(this.galaxy.seed, 'war', a, b);
    const period = 5 + r() * 9, phase = r(), bias = (r() - 0.5) * 0.4;
    const v = Math.sin(2 * Math.PI * (t / 86400 / period + phase)) + bias;
    return v > 0.45 ? Math.min(1, (v - 0.45) / 0.55) : 0;
  },
  frontline(sysId, t = this.worldTime()) {
    const s = this.sys(sysId); let max = 0, enemy = -1;
    for (const n of this.galaxy.adj[sysId]) {
      const o = this.sys(n).faction;
      if (o === s.faction) continue;
      const w = this.warIntensity(s.faction, o, t);
      if (w > max) { max = w; enemy = o; }
    }
    return { intensity: max, enemy };
  },
  danger(sysId, t = this.worldTime()) {
    return this.sys(sysId).dangerBase + Math.round(this.frontline(sysId, t).intensity * 3) + (this.ghostsInSystem(sysId, t).length ? 1 : 0);
  },

  // ---------- Deterministic market model ----------
  mkey(sysId, pIdx, cid) { return sysId + ':' + pIdx + ':' + cid; },
  disturbanceMult(sysId, pIdx, cid) {
    const now = U.now(); let m = 1;
    for (const d of this.state.disturbances) if (d.expiry > now && d.sector === sysId && (d.planet === pIdx || d.planet === 255) && d.commodity === cid) m *= d.mult;
    return U.clamp(m, 0.25, 4);
  },
  impact(key, t) {
    const im = this.state.impacts[key];
    if (!im) return 0;
    return im.v * Math.exp(-Math.max(0, t - im.t) / 7200);
  },
  addImpact(key, delta, t) { this.state.impacts[key] = { v: U.clamp(this.impact(key, t) + delta, -0.6, 1.5), t }; },
  priceInfo(sysId, pIdx, cid, t = this.worldTime()) {
    const s = this.sys(sysId), pl = s.planets[pIdx], c = COMMODITIES[cid], T = PLANET_TYPES[pl.type];
    const mod = T.prod.includes(cid) ? 0.62 : T.cons.includes(cid) ? 1.45 : 1.0;
    const r = U.rng(this.galaxy.seed, 'px', sysId, pIdx, cid);
    const phase = r(), period = (18 + r() * 60) * 3600, local = 0.9 + r() * 0.2;
    const w1 = 2 * Math.PI * (t / period + phase), w2 = 2 * Math.PI * (t / (period * 0.37) + phase * 3);
    const cyc = 1 + c.vol * Math.sin(w1) + c.vol * 0.5 * Math.sin(w2);
    const trend = Math.cos(w1) + 0.5 * Math.cos(w2) / 0.37;
    const front = this.frontline(sysId, t);
    const war = front.intensity > 0 ? 1 + front.intensity * ([4, 5, 7].includes(cid) ? 0.7 : 0.15) : 1;
    const dist = this.disturbanceMult(sysId, pIdx, cid);
    const imp = 1 + this.impact(this.mkey(sysId, pIdx, cid), t);
    const rep = 1 - U.clamp(this.state.rep[s.faction], -50, 50) / 1000;
    const listed = pl.marketList.includes(cid);
    const mid = c.base * mod * local * cyc * war * dist * imp;
    return { buy: Math.max(1, Math.round(mid * 1.05 * rep)), sell: Math.max(1, Math.round(mid * 0.95 / rep * (listed ? 1 : 0.8))), mid, trend, listed, dist };
  },
  stock(sysId, pIdx, cid, t = this.worldTime()) {
    const epoch = Math.floor(t / 21600);
    const T = PLANET_TYPES[this.sys(sysId).planets[pIdx].type];
    const r = U.rng(this.galaxy.seed, 'stk', sysId, pIdx, cid, epoch);
    const cap = T.prod.includes(cid) ? 120 : T.cons.includes(cid) ? 15 : 45;
    let s = Math.round(cap * (0.4 + 0.6 * r()));
    const pu = this.state.purchases[this.mkey(sysId, pIdx, cid)];
    if (pu && pu.epoch === epoch) s -= pu.qty;
    return Math.max(0, s);
  },
  cargoUsed() { return Object.values(this.state.ship.cargo).reduce((a, b) => a + b, 0); },
  cargoFree() { return this.shipStats().cargo - this.cargoUsed(); },

  buy(cid, qty) {
    const s = this.state, pl = this.herePlanet();
    if (!pl.market || !pl.marketList.includes(cid)) return this.fail('Not traded at this port');
    const t = this.worldTime(), pi = this.priceInfo(s.system, s.planet, cid, t);
    qty = Math.min(qty, this.stock(s.system, s.planet, cid, t), this.cargoFree(), Math.floor(s.credits / pi.buy));
    if (qty <= 0) return this.fail('Cannot buy: check credits, cargo space or stock');
    s.credits -= qty * pi.buy;
    s.ship.cargo[cid] = (s.ship.cargo[cid] || 0) + qty;
    const key = this.mkey(s.system, s.planet, cid), epoch = Math.floor(t / 21600);
    const pu = s.purchases[key];
    s.purchases[key] = { epoch, qty: (pu && pu.epoch === epoch ? pu.qty : 0) + qty };
    this.addImpact(key, 0.012 * qty, t);
    this.log(`Bought ${qty} ${COMMODITIES[cid].name} @ ${U.fmt(pi.buy)}cr`, 'trade');
    if (qty >= 15) this.broadcastTrade(s.system, s.planet, cid, U.clamp(1 + qty * 0.012, 1.1, 2.5), 6 * 3600, 'Market shortage');
    AudioEngine.play('coin'); this.changed();
    return true;
  },
  sell(cid, qty) {
    const s = this.state, pl = this.herePlanet(), c = COMMODITIES[cid];
    if (!pl.market) return this.fail('No market at this port');
    if (c.contraband && !pl.marketList.includes(cid)) return this.fail('No buyers for contraband here');
    qty = Math.min(qty, s.ship.cargo[cid] || 0);
    if (qty <= 0) return this.fail('Nothing to sell');
    const t = this.worldTime(), pi = this.priceInfo(s.system, s.planet, cid, t);
    s.credits += qty * pi.sell;
    s.ship.cargo[cid] -= qty; if (!s.ship.cargo[cid]) delete s.ship.cargo[cid];
    this.addImpact(this.mkey(s.system, s.planet, cid), -0.01 * qty, t);
    this.log(`Sold ${qty} ${c.name} @ ${U.fmt(pi.sell)}cr (+${U.fmt(qty * pi.sell)})`, 'trade');
    if (qty >= 15) this.broadcastTrade(s.system, s.planet, cid, U.clamp(1 - qty * 0.009, 0.45, 0.9), 6 * 3600, 'Market glut');
    AudioEngine.play('coin'); this.changed();
    return true;
  },
  fuelPrice() { const s = this.state; return Math.max(5, Math.round(this.priceInfo(s.system, s.planet, 4).buy / 6)); },
  refuel() {
    const s = this.state, st = this.shipStats();
    if (!this.herePlanet().market) return this.fail('No fuel depot here');
    const need = st.fuel - s.ship.fuel, p = this.fuelPrice();
    const n = Math.min(need, Math.floor(s.credits / p));
    if (n <= 0) return this.fail(need <= 0 ? 'Tanks already full' : 'Insufficient credits');
    s.ship.fuel += n; s.credits -= n * p;
    this.log(`Refueled ${n} units for ${U.fmt(n * p)}cr`, 'trade'); AudioEngine.play('confirm'); this.changed();
    return true;
  },
  repairCost() { return Math.round((this.shipStats().maxHull - this.state.ship.hull) * 30 * (1 - this.state.rep[this.here().faction] / 400)); },
  repair() {
    const s = this.state; if (!this.herePlanet().shipyard) return this.fail('Repairs require a shipyard');
    const cost = this.repairCost(); if (cost <= 0) return this.fail('Hull integrity nominal');
    if (s.credits < cost) return this.fail('Insufficient credits');
    s.credits -= cost; s.ship.hull = this.shipStats().maxHull;
    this.log(`Hull repaired for ${U.fmt(cost)}cr`, 'ship'); AudioEngine.play('confirm'); this.changed();
    return true;
  },
  restCost() { return this.state.crew.filter(c => c.hp < this.crewMaxHp(c)).length * 150; },
  restCrew() {
    const s = this.state; if (!this.herePlanet().tavern) return this.fail('No cantina medical bay here');
    const cost = this.restCost(); if (!cost) return this.fail('Crew is fit for duty');
    if (s.credits < cost) return this.fail('Insufficient credits');
    s.credits -= cost; s.crew.forEach(c => (c.hp = this.crewMaxHp(c)));
    s.timeOffset += 8 * 3600;
    this.log(`Crew rested and treated (${U.fmt(cost)}cr, 8h)`, 'crew'); AudioEngine.play('confirm'); this.changed();
    return true;
  },

  // ---------- Ship ----------
  shipStats(ship = this.state.ship) {
    const H = HULLS[ship.hullType];
    const s = { maxHull: H.hull, maxShield: H.shield, armor: H.armor, evasion: H.evasion, cargo: H.cargo, fuel: H.fuel, acc: 0, board: 0, medbay: false, crewMax: H.crew };
    ship.modules.u.forEach(id => {
      if (!id) return; const m = U_BY_ID[id];
      s.maxShield += m.shield || 0; s.armor += m.armor || 0; s.maxHull += m.hull || 0; s.evasion += m.evasion || 0;
      s.cargo += m.cargo || 0; s.fuel += m.fuel || 0; s.acc += m.acc || 0; s.board += m.board || 0; if (m.heal) s.medbay = true;
    });
    return s;
  },
  rating() {
    const st = this.shipStats();
    const w = this.state.ship.modules.w.filter(Boolean).map(id => W_BY_ID[id]);
    const r = st.maxHull + st.maxShield + st.armor * 12 + st.evasion * 25 + w.reduce((a, x) => a + x.dmg * 8, 0) + this.state.crew.reduce((a, c) => a + c.level * 20, 0);
    return U.clamp(Math.round(r), 0, 65535);
  },
  weaponHash(wlist) {
    let h = 0;
    for (let i = 0; i < 4; i++) { const id = wlist[i]; const idx = id ? WEAPONS.findIndex(w => w.id === id) + 1 : 0; h = (h << 8) | idx; }
    return h >>> 0;
  },
  decodeWeaponHash(h) {
    const out = [];
    for (let i = 0; i < 4; i++) { const b = (h >>> (24 - 8 * i)) & 255; if (b) out.push(WEAPONS[(b - 1) % WEAPONS.length]); }
    return out.length ? out : [WEAPONS[0]];
  },
  yardHulls() {
    const s = this.state, r = U.rng(this.galaxy.seed, 'yard', s.system, s.planet);
    const list = HULLS.map((h, i) => i).filter(() => r() < 0.55);
    if (!list.includes(s.ship.hullType)) list.push(s.ship.hullType);
    return list.sort((a, b) => a - b);
  },
  priceMod() { return 1 - U.clamp(this.state.rep[this.here().faction], -50, 50) / 400; },
  buyHull(ht) {
    const s = this.state, H = HULLS[ht];
    if (ht === s.ship.hullType) return this.fail('Already flying this hull');
    if (s.crew.length > H.crew) return this.fail(`Hull supports only ${H.crew} crew - dismiss crew first`);
    const newShip = { ...s.ship, hullType: ht, modules: { w: s.ship.modules.w.slice(0, H.wslots), u: s.ship.modules.u.slice(0, H.uslots) } };
    while (newShip.modules.w.length < H.wslots) newShip.modules.w.push(null);
    while (newShip.modules.u.length < H.uslots) newShip.modules.u.push(null);
    if (this.cargoUsed() > this.shipStats(newShip).cargo) return this.fail('Cargo would not fit in the new hull');
    const refund = [...s.ship.modules.w.slice(H.wslots).filter(Boolean).map(id => W_BY_ID[id].price), ...s.ship.modules.u.slice(H.uslots).filter(Boolean).map(id => U_BY_ID[id].price)].reduce((a, b) => a + b * 0.5, 0);
    const cost = Math.round(H.price * this.priceMod() - HULLS[s.ship.hullType].price * 0.6 - refund);
    if (s.credits < cost) return this.fail(`Need ${U.fmt(cost)}cr after trade-in`);
    s.credits -= cost;
    s.ship = newShip;
    const st = this.shipStats(); s.ship.hull = st.maxHull; s.ship.fuel = Math.min(s.ship.fuel, st.fuel);
    this.log(`Acquired ${H.name} hull (net ${U.fmt(cost)}cr)`, 'ship'); AudioEngine.play('victory'); this.changed();
    return true;
  },
  buyModule(kind, id) {
    const s = this.state, list = s.ship.modules[kind], slot = list.indexOf(null);
    if (slot < 0) return this.fail('No free slot - uninstall a module first');
    const m = kind === 'w' ? W_BY_ID[id] : U_BY_ID[id], cost = Math.round(m.price * this.priceMod());
    if (s.credits < cost) return this.fail('Insufficient credits');
    s.credits -= cost; list[slot] = id;
    this.log(`Installed ${m.name} (${U.fmt(cost)}cr)`, 'ship'); AudioEngine.play('confirm'); this.changed();
    return true;
  },
  sellModule(kind, slot) {
    const s = this.state, id = s.ship.modules[kind][slot]; if (!id) return false;
    const m = kind === 'w' ? W_BY_ID[id] : U_BY_ID[id];
    const test = { ...s.ship, modules: { w: [...s.ship.modules.w], u: [...s.ship.modules.u] } }; test.modules[kind][slot] = null;
    if (this.cargoUsed() > this.shipStats(test).cargo) return this.fail('Unload cargo before removing the pod');
    s.ship.modules[kind][slot] = null; s.credits += Math.round(m.price * 0.5);
    const st = this.shipStats(); s.ship.hull = Math.min(s.ship.hull, st.maxHull); s.ship.fuel = Math.min(s.ship.fuel, st.fuel);
    this.log(`Uninstalled ${m.name} (+${U.fmt(m.price * 0.5)}cr)`, 'ship'); AudioEngine.play('coin'); this.changed();
    return true;
  },

  // ---------- Crew ----------
  makeCrew(r, job, level, name) {
    const skills = {}; SKILLS.forEach(k => (skills[k] = U.ri(r, 1, 3)));
    JOBS[job].primary.forEach(k => (skills[k] += U.ri(r, 2, 3)));
    for (let l = 1; l < level; l++) { const k = r() < 0.6 ? U.pick(r, JOBS[job].primary) : U.pick(r, SKILLS); skills[k] = Math.min(10, skills[k] + 1); }
    SKILLS.forEach(k => (skills[k] = Math.min(10, skills[k])));
    const c = { id: 'c' + U.hex(Math.floor(r() * 4294967296)), name: name || `${U.pick(r, FIRST)} ${U.pick(r, LAST)}`, job, level, xp: 0, skills, seed: Math.floor(r() * 4294967296), cds: {}, hp: 1 };
    c.hp = this.crewMaxHp(c);
    return c;
  },
  crewMaxHp(c) { return 12 + c.skills.combat * 3 + c.level * 2; },
  bestCrew(skill) {
    const able = this.state.crew.filter(c => c.hp > 0);
    return (able.length ? able : this.state.crew).reduce((a, b) => (b.skills[skill] > a.skills[skill] ? b : a));
  },
  addXp(c, amt) {
    c.xp += amt;
    while (c.xp >= c.level * 100) {
      c.xp -= c.level * 100; c.level++;
      const p = JOBS[c.job].primary[Math.floor(Math.random() * JOBS[c.job].primary.length)];
      c.skills[p] = Math.min(10, c.skills[p] + 1);
      const k = SKILLS[Math.floor(Math.random() * SKILLS.length)]; c.skills[k] = Math.min(10, c.skills[k] + 1);
      this.log(`${c.name} reached level ${c.level}`, 'crew');
      ArtAndUIController.toast(`${c.name} promoted to level ${c.level}!`, 'gold');
    }
  },
  tavernCandidates() {
    const s = this.state, day = Math.floor(this.worldTime() / 86400);
    const r = U.rng(this.galaxy.seed, 'tavern', s.system, s.planet, day);
    const jobs = Object.keys(JOBS).filter(j => j !== 'Captain');
    const out = [];
    for (let i = 0; i < 3; i++) {
      const c = this.makeCrew(r, U.pick(r, jobs), U.ri(r, 1, 4));
      c.cost = 1200 * c.level + SKILLS.reduce((a, k) => a + c.skills[k], 0) * 90;
      if (!s.hiredIds.includes(c.id)) out.push(c);
    }
    return out;
  },
  hire(id) {
    const s = this.state, c = this.tavernCandidates().find(x => x.id === id);
    if (!c) return this.fail('Candidate no longer available');
    if (s.crew.length >= this.shipStats().crewMax) return this.fail('Crew quarters full');
    if (s.credits < c.cost) return this.fail('Insufficient credits');
    s.credits -= c.cost; delete c.cost; s.crew.push(c); s.hiredIds.push(c.id);
    this.log(`Hired ${c.name}, ${c.job}`, 'crew'); AudioEngine.play('confirm'); this.changed();
    return true;
  },
  dismiss(id) {
    const s = this.state, c = s.crew.find(x => x.id === id);
    if (!c || c.job === 'Captain') return false;
    s.crew = s.crew.filter(x => x.id !== id);
    this.log(`${c.name} left the crew`, 'crew'); this.changed();
    return true;
  },

  // ---------- Travel ----------
  route(to) {
    const from = this.state.system; if (from === to) return [];
    const prev = new Map([[from, -1]]), q = [from];
    while (q.length) {
      const c = q.shift(); if (c === to) break;
      for (const n of this.galaxy.adj[c]) if (!prev.has(n)) { prev.set(n, c); q.push(n); }
    }
    if (!prev.has(to)) return [];
    const path = []; for (let c = to; c !== from; c = prev.get(c)) path.unshift(c);
    return path;
  },
  travelPlanet(pIdx) {
    const s = this.state; if (pIdx === s.planet) return false;
    s.planet = pIdx; s.timeOffset += 2 * 3600;
    this.log(`Transit to ${this.herePlanet().name} (2h)`, 'nav'); AudioEngine.play('thrust'); this.changed();
    return true;
  },
  jump(target) {
    const s = this.state;
    if (!this.galaxy.adj[s.system].includes(target)) return { err: 'No jump lane to that system' };
    const cost = this.fuelCost(s.system, target);
    if (s.ship.fuel < cost) return { err: `Insufficient fuel (${cost} needed)` };
    const hours = this.travelHours(s.system, target);
    s.ship.fuel -= cost; s.timeOffset += Math.round(hours * 3600);
    s.system = target; s.planet = 0; s.jumps++;
    s.visited[target] = this.worldTime();
    if (s.route[0] === target) s.route.shift(); else s.route = [];
    s.crew.forEach(c => (c.hp = Math.min(this.crewMaxHp(c), c.hp + Math.ceil(this.crewMaxHp(c) * 0.25))));
    this.log(`Jumped to ${this.here().name} (${hours}h, ${cost} fuel)`, 'nav');
    if (U.now() - s.lastSigAt > 1200) this.broadcastSignature(true);
    const enc = this.rollEncounter(target);
    this.saveStarmap(target);
    this.changed();
    return { ok: true, enc };
  },

  // ---------- Encounters ----------
  ghostName(hash) {
    const r = U.rng('ghost', hash >>> 0);
    return `${U.pick(r, FIRST)} "${U.pick(r, ['Wraith', 'Specter', 'Echo', 'Shade', 'Phantom', 'Revenant', 'Mirage', 'Banshee'])}" ${U.pick(r, LAST)}`;
  },
  ghostSystem(player, t = this.worldTime()) { return U.hash32(this.galaxy.seed, 'gpos', player >>> 0, Math.floor(t / 14400)) % this.galaxy.N; },
  ghostsInSystem(sysId, t = this.worldTime()) {
    return Object.values(this.state.ghosts).filter(g => this.ghostSystem(g.player, t) === sysId);
  },
  wanted() { return this.state.bounties.filter(b => b.target === this.state.playerHash); },
  rollEncounter(sysId) {
    const s = this.state, t = this.worldTime();
    const r = U.rng(this.galaxy.seed, 'enc', sysId, Math.floor(t / 1800), s.jumps, s.playerHash);
    const danger = this.danger(sysId, t), ghosts = this.ghostsInSystem(sysId, t);
    const p = 0.16 + danger * 0.07 + (ghosts.length ? 0.15 : 0) + (this.wanted().length ? 0.1 : 0);
    if (r() > p) return null;
    const roll = r();
    if (this.wanted().length && roll < 0.2) return { type: 'hunter' };
    if (ghosts.length && roll < 0.45) return { type: 'ghost', ghost: ghosts[Math.floor(r() * ghosts.length)] };
    const front = this.frontline(sysId, t);
    if (front.intensity > 0 && roll < 0.6) return { type: 'warship', faction: front.enemy };
    if (roll < 0.74) return { type: 'pirate' };
    if (roll < 0.85) return { type: this.sys(sysId).faction === 4 ? 'pirate' : 'patrol', faction: this.sys(sysId).faction };
    if (roll < 0.94) return { type: 'merchant' };
    return { type: 'derelict' };
  },
  makeEnemy(kind, opts = {}) {
    const r = U.mulberry32((Math.random() * 4294967296) >>> 0);
    const pr = this.rating();
    let tier = U.clamp(Math.round(this.danger(this.state.system) / 2 + pr / 500 + r() * 1.5 - 0.5), 1, 9);
    let ht, weapons, crewN, name, faction = opts.faction ?? this.here().faction, aggro = 180, playerHash = null;
    if (kind === 'ghost') {
      const g = opts.ghost; playerHash = g.player;
      tier = U.clamp(Math.round(g.rating / 150), 1, 10); ht = g.hull % HULLS.length; aggro = g.aggro;
      weapons = this.decodeWeaponHash(g.weapons).slice(0, HULLS[ht].wslots);
      crewN = U.clamp(g.crew, 2, HULLS[ht].crew); name = this.ghostName(g.player); faction = -1;
    } else {
      if (kind === 'drill') { tier = opts.tier || U.clamp(Math.round(pr / 400), 1, 6); faction = -1; }
      if (kind === 'hunter') tier = Math.min(10, tier + 2);
      const pool = { pirate: [0, 2, 1, 5, 6], hunter: [2, 5, 6, 7], patrol: [1, 5, 6], warship: [5, 6, 7], merchant: [3, 4], drill: [1, 2, 5, 6] }[kind];
      ht = pool[Math.min(pool.length - 1, Math.floor((tier - 1) / 2 + r() * 1.5))];
      const n = Math.min(HULLS[ht].wslots, 1 + Math.floor(tier / 2));
      weapons = []; for (let i = 0; i < n; i++) weapons.push(U.pick(r, WEAPONS));
      crewN = U.clamp(2 + Math.floor(tier / 2), 2, HULLS[ht].crew);
      const F = FACTIONS[faction] || FACTIONS[4];
      name = {
        pirate: `${U.pick(r, ['Red', 'Black', 'Hollow', 'Rust', 'Grim', 'Void'])} ${U.pick(r, ['Jackal', 'Viper', 'Reaver', 'Talon', 'Maw', 'Corsair'])}`,
        hunter: `Bounty Hunter ${U.pick(r, LAST)}`,
        patrol: `${F.short} Patrol ${U.hex(Math.floor(r() * 65536), 4)}`,
        warship: `${F.short} Warship ${U.pick(r, ['Resolute', 'Vigilant', 'Tempest', 'Aegis', 'Bastion', 'Dominion'])}`,
        merchant: `Freighter ${U.pick(r, FIRST)}'s Fortune`,
        drill: `Holo-Drone Mk.${tier}`,
      }[kind];
      if (kind === 'merchant') aggro = 40;
      if (kind === 'patrol') aggro = 120;
    }
    const H = HULLS[ht], scale = 0.7 + tier * 0.1;
    const jobs = ['Captain', 'Gunner', 'Pilot', 'Engineer', 'Marine', 'Medic', 'Tactician', 'Scout'];
    const crew = [];
    for (let i = 0; i < crewN; i++) crew.push(this.makeCrew(r, jobs[i % jobs.length], Math.max(1, tier - 1 + U.ri(r, 0, 1))));
    const maxHull = Math.round(H.hull * scale), maxShield = Math.round(H.shield * scale);
    const lootC = U.ri(r, 0, COMMODITIES.length - 1);
    return {
      kind, name, faction, hullType: ht, tier, aggro, playerHash, seed: Math.floor(r() * 4294967296),
      maxHull, hull: maxHull, maxShield, shield: maxShield, armor: H.armor + Math.floor(tier / 3), evasion: H.evasion + (tier > 5 ? 1 : 0),
      weapons: weapons.map(w => ({ ...w, ready: 0 })), crew, cds: {},
      gunnery: Math.max(...crew.map(c => c.skills.gunnery)), piloting: Math.max(...crew.map(c => c.skills.piloting)),
      loot: { credits: Math.round((700 + tier * 850) * (0.7 + r() * 0.6) * (kind === 'merchant' ? 1.6 : 1)), cargo: lootC, qty: U.ri(r, 3, 6 + tier * 2) },
    };
  },
  skillCheck(skill, need = 2, bonus = 0) {
    const c = this.bestCrew(skill);
    const roll = Dice.roll(2 + Math.floor(c.skills[skill] / 2) + bonus, 4);
    AudioEngine.play('dice');
    return { ok: roll.hits >= need, roll, who: c };
  },
  encounterInfo(enc) {
    const s = this.state, F = f => (FACTIONS[f] ? FACTIONS[f].name : 'Unknown');
    switch (enc.type) {
      case 'pirate': return { title: 'Pirate Interdiction', text: 'A raider drops out of warp on an intercept vector and demands tribute.', options: [['fight', 'Battle stations'], ['toll', `Pay tribute (${U.fmt(this.toll())}cr)`], ['negotiate', 'Negotiate (Negotiation)'], ['run', 'Evade (Piloting)']] };
      case 'hunter': return { title: 'Bounty Hunter', text: `A hunter locks on - there is a ${U.fmt(this.wanted().reduce((a, b) => a + b.reward, 0))}cr bounty on your head.`, options: [['fight', 'Battle stations'], ['run', 'Evade (Piloting)']] };
      case 'patrol': return { title: `${F(enc.faction)} Patrol`, text: 'A patrol cutter orders you to heave to for a cargo inspection.', options: [['submit', 'Submit to scan'], ['negotiate', 'Talk your way out (Negotiation)'], ['fight', 'Open fire (reputation loss)']] };
      case 'warship': return { title: `${F(enc.faction)} Warship`, text: 'You have strayed into an active war front. An enemy warship challenges you.', options: [['fight', 'Battle stations'], ['negotiate', 'Claim neutrality (Negotiation)'], ['run', 'Evade (Piloting)']] };
      case 'merchant': return { title: 'Merchant Convoy', text: 'A lone freighter hails you, offering to trade surplus stock below market.', options: [['trade', 'Inspect their wares'], ['fight', 'Attack (piracy)'], ['ignore', 'Continue on course']] };
      case 'derelict': return { title: 'Derelict Signal', text: 'A drifting hulk emits a faint distress beacon. Salvage could be lucrative - or trapped.', options: [['salvage', 'Salvage (Engineering)'], ['ignore', 'Leave it']] };
      case 'ghost': {
        const g = enc.ghost, b = s.bounties.filter(x => x.target === g.player);
        const hostile = g.aggro >= 160;
        return { title: 'Ghost Fleet Contact', text: `Mesh echo of ${this.ghostName(g.player)} - ${HULLS[g.hull % HULLS.length].name}, rating ${g.rating}. ${hostile ? 'Their AI replica is spoiling for a fight.' : 'Their replica holds position.'}${b.length ? ` Bounty: ${U.fmt(b.reduce((a, x) => a + x.reward, 0))}cr.` : ''}`, options: hostile ? [['fight', 'Battle stations'], ['run', 'Evade (Piloting)']] : [['hail', 'Hail and swap intel'], ['fight', 'Engage'], ['ignore', 'Ignore']], ghost: true };
      }
    }
    return { title: 'Contact', text: '', options: [['ignore', 'Continue']] };
  },
  toll() { return Math.max(500, Math.round(this.state.credits * 0.1)); },
  resolveEncounter(enc, action) {
    const s = this.state;
    const kind = enc.type === 'ghost' ? 'ghost' : enc.type;
    const fight = () => ({ combat: this.makeEnemy(kind, { faction: enc.faction, ghost: enc.ghost }) });
    switch (action) {
      case 'fight':
        if (enc.type === 'patrol' || enc.type === 'merchant') { s.rep[this.here().faction] -= 12; s.aggro = Math.min(255, s.aggro + 15); }
        return fight();
      case 'toll': {
        const t = this.toll(); if (s.credits < t) return { text: 'You cannot afford the tribute. They open fire!', ...fight() };
        s.credits -= t; this.log(`Paid ${U.fmt(t)}cr tribute to pirates`, 'nav'); return { text: `Tribute of ${U.fmt(t)}cr paid. The raider withdraws.` };
      }
      case 'negotiate': {
        const ck = this.skillCheck('negotiation', 2, enc.type === 'patrol' ? 1 : 0);
        this.addXp(ck.who, 10);
        if (ck.ok) { this.log(`${ck.who.name} talked down a hostile contact`, 'crew'); return { text: `${ck.who.name} negotiates successfully.`, roll: ck.roll }; }
        return { text: `${ck.who.name}'s gambit fails. Weapons hot!`, roll: ck.roll, ...fight() };
      }
      case 'run': {
        const st = this.shipStats();
        const ck = this.skillCheck('piloting', 2, Math.floor(st.evasion / 2));
        this.addXp(ck.who, 10);
        if (ck.ok) { AudioEngine.play('thrust'); return { text: `${ck.who.name} threads an escape vector. Contact lost.`, roll: ck.roll }; }
        return { text: 'They match your burn. Engagement unavoidable!', roll: ck.roll, ...fight() };
      }
      case 'submit': {
        const spice = s.ship.cargo[9] || 0;
        if (spice) {
          const fine = Math.round(spice * COMMODITIES[9].base * 1.5);
          delete s.ship.cargo[9]; s.credits = Math.max(0, s.credits - fine); s.rep[enc.faction] -= 8;
          this.log(`Contraband confiscated, fined ${U.fmt(fine)}cr`, 'nav');
          return { text: `Scanners find ${spice} units of Xeno Spice. Cargo confiscated and ${U.fmt(fine)}cr fine levied.` };
        }
        s.rep[enc.faction] += 2; return { text: 'Scan clean. The patrol logs your cooperation (+reputation).' };
      }
      case 'trade': {
        const r = U.rng(this.galaxy.seed, 'merchant', s.jumps, s.system);
        const cid = U.ri(r, 0, COMMODITIES.length - 1);
        const price = Math.round(COMMODITIES[cid].base * 0.7);
        const qty = Math.min(20, this.cargoFree(), Math.floor(s.credits / price));
        if (qty <= 0) return { text: 'You lack the cargo space or credits to deal.' };
        s.credits -= qty * price; s.ship.cargo[cid] = (s.ship.cargo[cid] || 0) + qty;
        this.log(`Bought ${qty} ${COMMODITIES[cid].name} from convoy @ ${price}cr`, 'trade'); AudioEngine.play('coin');
        return { text: `Purchased ${qty} ${COMMODITIES[cid].name} at ${price}cr/unit.` };
      }
      case 'salvage': {
        const ck = this.skillCheck('engineering', 2);
        this.addXp(ck.who, 12);
        if (ck.ok) {
          const cr = 800 + ck.roll.hits * 600; s.credits += cr;
          const cid = [10, 11, 6, 3][Math.floor(Math.random() * 4)], q = Math.min(this.cargoFree(), 2 + ck.roll.hits);
          if (q > 0) s.ship.cargo[cid] = (s.ship.cargo[cid] || 0) + q;
          this.log(`Salvaged derelict: ${U.fmt(cr)}cr${q > 0 ? ` + ${q} ${COMMODITIES[cid].name}` : ''}`, 'nav'); AudioEngine.play('coin');
          return { text: `${ck.who.name} cracks the hulk: ${U.fmt(cr)}cr${q > 0 ? ` and ${q} ${COMMODITIES[cid].name}` : ''} recovered.`, roll: ck.roll };
        }
        const dmg = Math.round(this.shipStats().maxHull * 0.12); s.ship.hull = Math.max(1, s.ship.hull - dmg); AudioEngine.play('impact');
        return { text: `Booby trap! The derelict's reactor vents - ${dmg} hull damage.`, roll: ck.roll };
      }
      case 'hail': {
        const g = enc.ghost, sysId = this.ghostSystem(g.player, this.worldTime() + 14400);
        const pl = this.sys(sysId).planets[0], cid = Math.floor(Math.random() * COMMODITIES.length);
        this.state.disturbances.push({ sector: sysId, planet: 0, commodity: cid, mult: 1.6, expiry: U.now() + 4 * 3600, id: 'hail' + Date.now() });
        s.aggro = Math.max(0, s.aggro - 5);
        return { text: `${this.ghostName(g.player)}'s echo shares intel: ${COMMODITIES[cid].name} demand surging at ${pl.name}.` };
      }
      default: return { text: 'You continue on course.' };
    }
  },

  // ---------- Mesh: outbound ----------
  signature(departing = false) {
    const s = this.state;
    return { player: s.playerHash, hull: s.ship.hullType, rating: this.rating(), aggro: s.aggro, crew: s.crew.length, weapons: this.weaponHash(s.ship.modules.w), departing };
  },
  broadcastSignature(auto = false) {
    this.state.lastSigAt = U.now();
    MeshProtocol.manager.queue(MeshProtocol.packSignature(this.signature()), auto ? 'Auto ship signature' : 'Ship signature', 'sig');
    if (!auto) { ArtAndUIController.toast('Ship signature queued for broadcast', 'cy'); AudioEngine.play('radio'); }
    this.save();
  },
  // ---------- Presence (who is on the mesh) ----------
  PRESENCE_ONLINE: 35 * 60, PRESENCE_RECENT: 2 * 3600,
  isSim(g) { return g.source === 'sim'; },
  presence(g, now = U.now()) {
    const age = Math.max(0, now - (g.lastHeard || g.seen));
    if (g.departed) return { status: 'offline', age };
    return { status: age <= this.PRESENCE_ONLINE ? 'online' : age <= this.PRESENCE_RECENT ? 'recent' : 'offline', age };
  },
  presenceList(includeSim = false) {
    const now = U.now();
    return Object.values(this.state.ghosts).filter(g => includeSim || !this.isSim(g)).map(g => ({ g, ...this.presence(g, now) })).sort((a, b) => a.age - b.age);
  },
  onlineCount() { return this.presenceList().filter(x => x.status === 'online').length; },
  updatePresence(p, source, meta) {
    const s = this.state, key = U.hex(p.player), now = U.now(), prev = s.ghosts[key];
    let heard = now;
    if (meta && meta.ts && meta.ts > now - 7 * 86400 && meta.ts < now + 300) heard = Math.min(meta.ts, now);
    if (prev && prev.lastHeard && heard < prev.lastHeard) return; // late catch-up copy; keep newer info
    const wasOnline = !!prev && !this.isSim(prev) && this.presence(prev, now).status === 'online';
    const g = s.ghosts[key] = {
      player: p.player, hull: p.hull, rating: p.rating, aggro: p.aggro, crew: p.crew, weapons: p.weapons,
      seen: now, lastHeard: heard, source, hops: meta && meta.hops != null ? meta.hops : null, snr: meta && meta.snr != null ? meta.snr : null, departed: !!p.departing,
    };
    if (this.isSim(g)) return;
    const isOnline = this.presence(g, now).status === 'online';
    if (isOnline && !wasOnline) { ArtAndUIController.toast(`${this.ghostName(p.player)} is on the mesh`, 'grn'); AudioEngine.play('radio'); }
    if (p.departing && wasOnline) ArtAndUIController.toast(`${this.ghostName(p.player)} signed off`, 'dim');
  },
  heartbeatTick() {
    const s = this.state, M = MeshProtocol.manager, min = s.settings.heartbeat | 0;
    if (!min || !M.online() || !M.client.ready) return;
    if (U.now() - s.lastSigAt >= min * 60) this.broadcastSignature(true);
  },
  signOff() { return MeshProtocol.manager.signOff(MeshProtocol.packSignature(this.signature(true))); },
  broadcastTrade(sector, planet, commodity, mult, ttl, label) {
    MeshProtocol.manager.queue(MeshProtocol.packTrade({ sector, planet, commodity, mult, expiry: U.now() + ttl }), `${label}: ${COMMODITIES[commodity].short}`);
  },
  spreadRumor(cid, up) {
    const s = this.state, cost = 600;
    if (s.credits < cost) return this.fail('Rumor-mongering costs 600cr');
    s.credits -= cost;
    this.broadcastTrade(s.system, s.planet, cid, up ? 1.6 : 0.6, 4 * 3600, up ? 'Rumor (spike)' : 'Rumor (crash)');
    this.log(`Spread a ${up ? 'shortage' : 'glut'} rumor about ${COMMODITIES[cid].name}`, 'mesh'); AudioEngine.play('radio'); this.changed();
    return true;
  },
  postBounty(target, reward) {
    const s = this.state; reward = Math.round(reward);
    if (reward < 1000) return this.fail('Minimum bounty is 1,000cr');
    if (s.credits < reward) return this.fail('Insufficient credits');
    s.credits -= reward;
    const pkt = { target: target >>> 0, sector: this.ghostSystem(target), reward, faction: this.here().faction };
    MeshProtocol.manager.queue(MeshProtocol.packBounty(pkt), `Bounty on ${U.hex(target)}`);
    s.bounties.push({ ...pkt, id: 'own' + Date.now(), t: U.now(), own: true });
    this.log(`Posted ${U.fmt(reward)}cr bounty on ${this.ghostName(target)}`, 'mesh'); AudioEngine.play('radio'); this.changed();
    return true;
  },

  // ---------- Mesh: inbound ----------
  applyPacket(p, bytes, source, meta = {}) {
    const s = this.state, id = U.hexBytes(bytes, '');
    if (p.kind === 'signature') {
      if (p.player === s.playerHash) return;
      this.updatePresence(p, source, meta); // heartbeats repeat identical bytes, so presence updates before de-duplication
    }
    if (this.seen.has(id)) { if (p.kind === 'signature') this.changed(); return; }
    this.seen.add(id);
    let text = '';
    if (p.kind === 'trade') {
      const sys = this.galaxy.systems[p.sector], c = COMMODITIES[p.commodity];
      if (!sys || !c || (p.planet !== 255 && !sys.planets[p.planet])) text = `Unresolvable trade bulletin (sector ${p.sector}, foreign seed?)`;
      else {
        const exp = MeshProtocol.decodeExpiry(p.expiry16, U.now());
        if (exp > U.now()) s.disturbances.push({ sector: p.sector, planet: p.planet, commodity: p.commodity, mult: p.mult, expiry: exp, id });
        text = `${c.name} ${p.mult >= 1 ? 'shortage' : 'glut'} at ${p.planet === 255 ? 'all ports of ' + sys.name : sys.planets[p.planet].name} - x${p.mult.toFixed(2)} until ${U.fmtTime(exp)}${exp <= U.now() ? ' (expired)' : ''}`;
      }
    } else if (p.kind === 'bounty') {
      const me = p.target === s.playerHash;
      if (!s.bounties.some(b => b.id === id)) s.bounties.push({ id, target: p.target, sector: p.sector, reward: p.reward, faction: p.faction, t: U.now() });
      const sys = this.galaxy.systems[p.sector];
      text = `${U.fmt(p.reward)}cr bounty on ${me ? 'YOU' : this.ghostName(p.target)} (${FACTIONS[p.faction] ? FACTIONS[p.faction].name : 'Independent'}) - last seen ${sys ? sys.name : 'sector ' + p.sector}`;
      if (me) { AudioEngine.play('klaxon'); ArtAndUIController.toast('A bounty has been posted on YOUR ship!', 'red'); }
    } else if (p.kind === 'signature') {
      text = p.departing
        ? `${this.ghostName(p.player)} signed off the mesh`
        : `Ghost signature ${this.ghostName(p.player)}: ${HULLS[p.hull % HULLS.length].name}, rating ${p.rating}, crew ${p.crew}, aggro ${p.aggro}`;
    }
    const b = { id, kind: p.kind, text, t: Date.now(), source, hex: U.hexBytes(bytes) };
    this.bulletins.unshift(b); if (this.bulletins.length > 200) this.bulletins.length = 200;
    StorageManager.put('bulletins', b);
    if (source !== 'sim') { this.unread++; AudioEngine.play('radio'); }
    this.prune();
    this.changed();
  },
  prune() {
    const s = this.state, now = U.now();
    s.disturbances = s.disturbances.filter(d => d.expiry > now).slice(-150);
    s.bounties = s.bounties.filter(b => now - b.t < 3 * 86400);
    const gs = Object.entries(s.ghosts).sort((a, b) => b[1].seen - a[1].seen).slice(0, 40);
    s.ghosts = Object.fromEntries(gs.filter(([, g]) => now - g.seen < 7 * 86400));
  },
  simTick() {
    const s = this.state;
    if (!s.settings.simPeers) return;
    const bucket = Math.floor(U.now() / 7200);
    if (s.simBucket === bucket) return;
    s.simBucket = bucket;
    const seed = this.galaxy.seed, r = U.rng(seed, 'sim', bucket), pkts = [], sims = [];
    for (let i = 0; i < 6; i++) {
      const h = U.hash32(seed, 'simpilot', i), hull = h % HULLS.length;
      const wl = []; for (let k = 0; k < Math.min(4, HULLS[hull].wslots); k++) wl.push(WEAPONS[(h >>> (k * 3)) % WEAPONS.length].id);
      sims.push(h);
      pkts.push(MeshProtocol.packSignature({ player: h, hull, rating: 250 + (h % 700) + (bucket % 40) * 6, aggro: (h >>> 8) & 255, crew: 3 + (h % 5), weapons: this.weaponHash(wl) }));
    }
    const nb = U.ri(r, 1, 2);
    for (let i = 0; i < nb; i++) {
      const target = s.kills >= 3 && r() < 0.25 ? s.playerHash : U.pick(r, sims);
      pkts.push(MeshProtocol.packBounty({ target, sector: this.ghostSystem(target), reward: U.ri(r, 20, 150) * 100, faction: U.ri(r, 0, 3) }));
    }
    const nt = U.ri(r, 2, 4);
    for (let i = 0; i < nt; i++) {
      const sys = U.pick(r, this.galaxy.systems), pl = U.pick(r, sys.planets);
      pkts.push(MeshProtocol.packTrade({ sector: sys.id, planet: pl.id, commodity: U.pick(r, pl.marketList), mult: r() < 0.5 ? 1.3 + r() * 0.9 : 0.45 + r() * 0.35, expiry: bucket * 7200 + U.ri(r, 3, 9) * 3600 }));
    }
    pkts.forEach(b => this.applyPacket(MeshProtocol.unpack(b), b, 'sim'));
  },

  // ---------- Logging / notifications ----------
  log(msg, type = 'info') {
    this.state.log.unshift({ t: this.worldTime(), msg, type });
    if (this.state.log.length > 160) this.state.log.length = 160;
  },
  fail(msg) { ArtAndUIController.toast(msg, 'red'); AudioEngine.play('error'); return false; },
  changed() { this.save(); ArtAndUIController.render(); },

  // ---------- Persistence ----------
  newState(seed, callsign) {
    const g = this.galaxy = this.generateGalaxy(seed);
    const r = U.rng(seed, 'start', Date.now());
    const home = g.homes[0];
    const st = {
      version: 1, seed: seed >>> 0, playerHash: (Math.random() * 4294967296) >>> 0, callsign: callsign || 'Captain',
      credits: 20000, timeOffset: 0, system: home, planet: 0,
      ship: { name: 'ISV Wayfarer', hullType: 1, hull: HULLS[1].hull, fuel: HULLS[1].fuel, modules: { w: ['laser', 'rail'], u: ['cargo', null] }, cargo: {} },
      crew: [], rep: [10, 0, 0, 0, 0], impacts: {}, purchases: {}, visited: { [home]: U.now() }, kills: 0, aggro: 40, jumps: 0,
      log: [], disturbances: [], bounties: [], ghosts: {}, lastSigAt: 0, simBucket: -1, hiredIds: [], route: [],
      settings: { channelAuto: true, channel: 0, roomPassword: '', roomFilter: '', simPeers: true, heartbeat: 15 },
    };
    this.state = st;
    st.crew = [this.makeCrew(r, 'Captain', 2, st.callsign), this.makeCrew(r, 'Pilot', 1), this.makeCrew(r, 'Gunner', 1), this.makeCrew(r, 'Engineer', 1)];
    st.ship.hull = this.shipStats().maxHull;
    this.log(`Commission granted. ${st.ship.name} departs ${this.here().name}. Sector seed 0x${U.hex(seed)}.`, 'nav');
    return st;
  },
  async load() {
    const saved = await StorageManager.get('ship', 'player');
    if (saved && saved.version === 1) {
      const crew = await StorageManager.all('crew');
      delete saved.id;
      saved.crew = crew.sort((a, b) => a.order - b.order).map(c => { delete c.order; return c; });
      if (saved.settings.channelAuto === undefined) saved.settings.channelAuto = true;
      if (saved.settings.heartbeat === undefined) saved.settings.heartbeat = 15;
      this.state = saved;
      this.galaxy = this.generateGalaxy(saved.seed);
    } else {
      this.newState(0xA9F3C104, 'Captain');
      this.fresh = true;
      await this.saveNow();
    }
    const bs = await StorageManager.all('bulletins');
    bs.sort((a, b) => b.t - a.t);
    this.bulletins = bs.slice(0, 200);
    this.seen = new Set(bs.map(b => b.id));
    if (bs.length > 300) bs.slice(300).forEach(b => StorageManager.del('bulletins', b.id));
    this.prune();
  },
  save() { if (this.frozen) return; clearTimeout(this.saveTimer); this.saveTimer = setTimeout(() => this.saveNow(), 400); },
  async saveNow() {
    const s = this.state; if (!s || this.frozen) return;
    const { crew, ...rest } = s;
    await StorageManager.put('ship', { id: 'player', ...JSON.parse(JSON.stringify(rest)) });
    await StorageManager.replaceAll('crew', crew.map((c, i) => ({ ...JSON.parse(JSON.stringify(c)), order: i })));
    await StorageManager.put('meta', { key: 'lastSave', t: Date.now(), seed: s.seed });
  },
  saveStarmap(sysId) {
    const sys = this.sys(sysId);
    StorageManager.put('starmap', { id: `${U.hex(this.galaxy.seed)}:${sysId}`, seed: this.galaxy.seed, sys: sysId, name: sys.name, faction: sys.faction, visitedAt: this.worldTime() });
  },
  async resetWorld(seed, callsign) {
    const old = this.state;
    await StorageManager.clear('ship'); await StorageManager.clear('crew'); await StorageManager.clear('starmap');
    this.newState(seed, callsign);
    if (old) {
      const s = this.state, same = old.seed === (seed >>> 0);
      s.playerHash = old.playerHash; s.settings = old.settings; s.ghosts = old.ghosts;
      if (old.tutorial) s.tutorial = old.tutorial;
      s.bounties = old.bounties.filter(b => !b.own);
      s.simBucket = same ? old.simBucket : -1;
      if (same) s.disturbances = old.disturbances;
      this.simTick();
    }
    this.saveStarmap(this.state.system);
    await this.saveNow();
  },
};

// ============================================================================
// CombatEngine: turn-based tactical grid, dice pools, talents, AI, boarding
// ============================================================================
const CombatEngine = {
  c: null, busy: false, COLS: 9, ROWS: 5, logSeq: 0,

  start(enemy) {
    const S = GameEngine.state, st = GameEngine.shipStats();
    const rocks = new Set(), nebula = new Set(), blocked = new Set(['1,2', '7,2', '0,2', '8,2']);
    for (let i = 0; i < 5; i++) { const k = `${U.ri(Math.random, 2, 6)},${U.ri(Math.random, 0, this.ROWS - 1)}`; if (!blocked.has(k)) rocks.add(k); }
    for (let i = 0; i < 5; i++) { const k = `${U.ri(Math.random, 1, 7)},${U.ri(Math.random, 0, this.ROWS - 1)}`; if (!rocks.has(k)) nebula.add(k); }
    this.c = {
      enemy, drill: enemy.kind === 'drill', turn: 1, ap: 3, phase: 'player', over: false, result: null, summary: [],
      p: { x: 1, y: 2, eff: {} }, e: { x: 7, y: 2, eff: {} }, pShield: st.maxShield,
      wFired: [], wReady: S.ship.modules.w.map(() => 0), rocks, nebula, log: [], boarding: null,
      snapshot: enemy.kind === 'drill' ? { hull: S.ship.hull, crew: S.crew.map(x => x.hp) } : null,
    };
    enemy.weapons.forEach(w => { w.ready = 0; w.fired = false; });
    S.crew.forEach(x => (x.cds = {}));
    this.busy = false;
    this.startPlayerTurn(true);
    this.log(`<b class="red">RED ALERT</b> - ${U.esc(enemy.name)} (${HULLS[enemy.hullType].name}, tier ${enemy.tier}) engaging. Shields up.`);
    AudioEngine.play('klaxon');
    setTimeout(() => AudioEngine.play('shield'), 1400);
    ArtAndUIController.switchTab('tactical');
  },
  log(html) { if (!this.c) return; this.c.log.push({ id: ++this.logSeq, html }); if (this.c.log.length > 120) this.c.log.shift(); },
  key(p) { return p.x + ',' + p.y; },
  dist() { return U.cheb(this.c.p, this.c.e); },
  canAct() { const c = this.c; return !!c && !c.over && c.phase === 'player' && !c.boarding && !this.busy; },
  evasion(side) {
    const c = this.c, pos = side === 'p' ? c.p : c.e;
    const base = side === 'p'
      ? GameEngine.shipStats().evasion + Math.floor(GameEngine.bestCrew('piloting').skills.piloting / 3)
      : c.enemy.evasion + Math.floor(c.enemy.piloting / 3);
    return Math.max(0, base + (pos.eff.evasive ? 3 : 0) + (c.nebula.has(this.key(pos)) ? 1 : 0) - (pos.eff.exposed ? 2 : 0));
  },
  armor(side) {
    const c = this.c, pos = side === 'p' ? c.p : c.e;
    if (pos.eff.exposed) return 0;
    return side === 'p' ? GameEngine.shipStats().armor : c.enemy.armor;
  },
  hitTN(defSide) { return U.clamp(3 + Math.ceil(this.evasion(defSide) / 2) + (this.dist() >= 6 ? 1 : 0), 2, 6); },
  validCell(x, y, side) {
    const c = this.c;
    if (x < 0 || y < 0 || x >= this.COLS || y >= this.ROWS) return false;
    if (c.rocks.has(x + ',' + y)) return false;
    const other = side === 'p' ? c.e : c.p;
    return !(other.x === x && other.y === y);
  },
  moveTargets() {
    if (!this.canAct() || this.c.ap < 1) return [];
    const out = [], p = this.c.p;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      if (!dx && !dy) continue;
      if (this.validCell(p.x + dx, p.y + dy, 'p')) out.push({ x: p.x + dx, y: p.y + dy });
    }
    return out;
  },
  move(x, y) {
    if (!this.moveTargets().some(m => m.x === x && m.y === y)) return;
    this.c.p.x = x; this.c.p.y = y; this.c.ap--;
    AudioEngine.play('thrust');
    ArtAndUIController.render();
  },
  weaponState(i) {
    const c = this.c, id = GameEngine.state.ship.modules.w[i];
    if (!id) return null;
    const w = W_BY_ID[id], d = this.dist();
    const inRange = d >= w.rmin && d <= w.rmax, ready = c.wReady[i] === 0 && !c.wFired[i];
    return { w, inRange, ready, cd: c.wReady[i], usable: this.canAct() && c.ap >= 1 && inRange && ready };
  },
  applyDamage(side, dmg, w) {
    const c = this.c, S = GameEngine.state;
    let sh = side === 'p' ? c.pShield : c.enemy.shield, rem = dmg, absorbed = 0;
    if (sh > 0) { const sd = dmg * w.shieldMul; absorbed = Math.min(sh, sd); sh -= absorbed; rem = (sd - absorbed) / w.shieldMul; }
    const arm = Math.max(0, this.armor(side) - w.pierce);
    const hullDmg = rem > 0.5 ? Math.max(1, Math.round(rem - arm)) : 0;
    if (side === 'p') { c.pShield = sh; S.ship.hull = Math.max(0, S.ship.hull - hullDmg); }
    else { c.enemy.shield = sh; c.enemy.hull = Math.max(0, c.enemy.hull - hullDmg); }
    return { absorbed: Math.round(absorbed), hullDmg };
  },
  async fire(i) {
    const ws = this.weaponState(i);
    if (!ws || !ws.usable) return;
    const c = this.c, w = ws.w, st = GameEngine.shipStats(), gun = GameEngine.bestCrew('gunnery');
    this.busy = true;
    const lock = !!c.p.eff.lock;
    const pool = 2 + Math.floor(gun.skills.gunnery / 2) + w.acc + st.acc + (lock ? 3 : 0) - (c.p.eff.jammed ? 2 : 0);
    const r = Dice.roll(pool, this.hitTN('e'), lock ? 5 : 6);
    c.p.eff.lock = false; c.ap--; c.wFired[i] = true; c.wReady[i] = w.cd;
    AudioEngine.play(w.sfx); AudioEngine.play('dice');
    ArtAndUIController.fx('p', w.color, r.hits > 0);
    await U.sleep(260);
    if (!this.c) return;
    if (r.hits) {
      const dmg = w.dmg * (1 + 0.3 * (r.hits - 1)) + r.crits * 3;
      const res = this.applyDamage('e', dmg, w);
      AudioEngine.play(res.hullDmg ? 'impact' : 'shieldHit');
      this.log(`<span class="cy">${U.esc(gun.name)}</span> fires ${w.name} ${Dice.html(r)} → <b>${r.hits} hit${r.hits > 1 ? 's' : ''}</b>: ${res.absorbed ? res.absorbed + ' shield, ' : ''}<b class="gold">${res.hullDmg} hull</b>`);
      GameEngine.addXp(gun, 4);
    } else {
      AudioEngine.play('miss');
      this.log(`<span class="cy">${U.esc(gun.name)}</span> fires ${w.name} ${Dice.html(r)} → <span class="dim">miss</span>`);
    }
    this.busy = false;
    if (c.enemy.hull <= 0) return this.end('victory');
    ArtAndUIController.render();
  },
  talentState(crew) {
    const t = JOBS[crew.job].talent, T = TALENTS[t], cd = crew.cds[t] || 0;
    let usable = this.canAct() && this.c.ap >= 1 && cd === 0 && crew.hp > 0;
    if (t === 'breach' && this.dist() > 2) usable = false;
    if (t === 'overcharge' && this.c.pShield >= GameEngine.shipStats().maxShield) usable = false;
    if (t === 'triage' && GameEngine.state.ship.hull >= GameEngine.shipStats().maxHull) usable = false;
    return { id: t, T, cd, usable };
  },
  useTalent(crewId) {
    const S = GameEngine.state, crew = S.crew.find(x => x.id === crewId);
    if (!crew) return;
    const ts = this.talentState(crew);
    if (!ts.usable) return;
    const c = this.c, st = GameEngine.shipStats();
    c.ap--; crew.cds[ts.id] = ts.T.cd;
    GameEngine.addXp(crew, 6);
    const who = `<span class="gold">${U.esc(crew.name)}</span>`;
    switch (ts.id) {
      case 'rally': c.ap += 2; this.log(`${who}: <b>${ts.T.name}</b> - crew surges (+2 AP)`); AudioEngine.play('confirm'); break;
      case 'evasive': c.p.eff.evasive = 2; this.log(`${who}: <b>${ts.T.name}</b> - evasion +3`); AudioEngine.play('thrust'); break;
      case 'lock': c.p.eff.lock = true; this.log(`${who}: <b>${ts.T.name}</b> - next volley +3 dice, crit 5+`); AudioEngine.play('alert'); break;
      case 'overcharge': { const g = Math.round(st.maxShield * 0.45); c.pShield = Math.min(st.maxShield, c.pShield + g); this.log(`${who}: <b>${ts.T.name}</b> - shields +${g}`); AudioEngine.play('shield'); break; }
      case 'triage': { const g = Math.round(st.maxHull * 0.15); S.ship.hull = Math.min(st.maxHull, S.ship.hull + g); this.log(`${who}: <b>${ts.T.name}</b> - hull +${g}`); AudioEngine.play('confirm'); break; }
      case 'analysis': c.e.eff.exposed = 2; this.log(`${who}: <b>${ts.T.name}</b> - enemy armor stripped, evasion -2`); AudioEngine.play('alert'); break;
      case 'jam': c.e.eff.jammed = 2; this.log(`${who}: <b>${ts.T.name}</b> - enemy fire control jammed (-2 dice)`); AudioEngine.play('radio'); break;
      case 'breach': this.log(`${who}: <b>${ts.T.name}</b> launched!`); this.startBoarding(2); return;
    }
    ArtAndUIController.render();
  },
  canBoard() { return this.canAct() && this.c.ap >= 2 && this.dist() <= 1 && GameEngine.state.crew.some(x => x.hp > 0); },
  board() { if (!this.canBoard()) return; this.c.ap -= 2; this.startBoarding(0); },
  canFlee() { return this.canAct() && this.c.ap >= 2 && (this.c.p.x === 0 || this.dist() >= 5); },
  flee() {
    if (!this.canFlee()) return;
    const c = this.c, pil = GameEngine.bestCrew('piloting');
    c.ap -= 2;
    const r = Dice.roll(2 + Math.floor(pil.skills.piloting / 2) + Math.floor(this.evasion('p') / 2), 4);
    AudioEngine.play('dice');
    GameEngine.addXp(pil, 8);
    if (r.hits >= 2) { this.log(`<span class="cy">${U.esc(pil.name)}</span> plots an escape burn ${Dice.html(r)} → <b class="grn">clean jump!</b>`); AudioEngine.play('warp'); return this.end('fled'); }
    this.log(`<span class="cy">${U.esc(pil.name)}</span> attempts escape ${Dice.html(r)} → <span class="red">jump drive fails to spool</span>`);
    ArtAndUIController.render();
  },
  endTurn() { if (!this.canAct()) return; this.enemyTurn(); },
  startPlayerTurn(first = false) {
    const c = this.c, S = GameEngine.state, st = GameEngine.shipStats();
    c.phase = 'player';
    if (!first) {
      c.turn++;
      c.wReady = c.wReady.map(v => Math.max(0, v - 1));
      S.crew.forEach(x => Object.keys(x.cds).forEach(k => { if (x.cds[k] > 0) x.cds[k]--; }));
      [c.p.eff, c.e.eff].forEach(eff => Object.keys(eff).forEach(k => { if (typeof eff[k] === 'number') { eff[k]--; if (eff[k] <= 0) delete eff[k]; } }));
      const regen = Math.floor(GameEngine.bestCrew('engineering').skills.engineering * 1.5);
      if (c.pShield < st.maxShield) c.pShield = Math.min(st.maxShield, c.pShield + regen);
      c.enemy.shield = Math.min(c.enemy.maxShield, c.enemy.shield + c.enemy.tier * 2);
    }
    c.wFired = [];
    c.ap = 3 + (GameEngine.bestCrew('piloting').skills.piloting >= 8 ? 1 : 0);
    ArtAndUIController.render();
  },
  enemyHas(job) { return this.c.enemy.crew.some(x => x.job === job && x.hp > 0); },
  enemyStep(scoreFn) {
    const c = this.c, cur = scoreFn(c.e.x, c.e.y);
    let best = null, bs = cur;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      if (!dx && !dy) continue;
      const x = c.e.x + dx, y = c.e.y + dy;
      if (!this.validCell(x, y, 'e')) continue;
      const s = scoreFn(x, y) + (c.nebula.has(x + ',' + y) ? -0.2 : 0);
      if (s < bs - 0.01) { bs = s; best = { x, y }; }
    }
    if (!best) return false;
    c.e.x = best.x; c.e.y = best.y;
    return true;
  },
  async enemyFire(w) {
    const c = this.c, e = c.enemy;
    const pool = 2 + Math.floor(e.gunnery / 2) + w.acc - (c.e.eff.jammed ? 2 : 0);
    const r = Dice.roll(pool, this.hitTN('p'));
    w.fired = true; w.ready = w.cd;
    AudioEngine.play(w.sfx);
    ArtAndUIController.fx('e', w.color, r.hits > 0);
    await U.sleep(260);
    if (!this.c) return;
    if (r.hits) {
      const res = this.applyDamage('p', w.dmg * (1 + 0.3 * (r.hits - 1)) + r.crits * 3, w);
      AudioEngine.play(res.hullDmg ? 'impact' : 'shieldHit');
      this.log(`<span class="red">${U.esc(e.name)}</span> fires ${w.name} ${Dice.html(r)} → ${res.absorbed ? res.absorbed + ' shield, ' : ''}<b class="red">${res.hullDmg} hull</b>`);
    } else {
      AudioEngine.play('miss');
      this.log(`<span class="red">${U.esc(e.name)}</span> fires ${w.name} ${Dice.html(r)} → <span class="dim">miss</span>`);
    }
    ArtAndUIController.render();
    if (GameEngine.state.ship.hull <= 0) this.end('defeat');
  },
  async enemyTurn() {
    const c = this.c, e = c.enemy;
    c.phase = 'enemy'; this.busy = true;
    ArtAndUIController.render();
    await U.sleep(450);
    let ap = 3;
    if (e.shield < e.maxShield * 0.3 && !(e.cds.overcharge > 0) && this.enemyHas('Engineer')) {
      e.shield = Math.min(e.maxShield, e.shield + Math.round(e.maxShield * 0.45)); e.cds.overcharge = 4; ap--;
      this.log(`<span class="red">${U.esc(e.name)}</span> overcharges shields`); AudioEngine.play('shield');
      ArtAndUIController.render(); await U.sleep(400);
    }
    if (ap > 0 && e.hull < e.maxHull * 0.5 && !(e.cds.evasive > 0) && this.enemyHas('Pilot')) {
      c.e.eff.evasive = 2; e.cds.evasive = 4; ap--;
      this.log(`<span class="red">${U.esc(e.name)}</span> executes evasive maneuvers`);
    }
    if (ap > 0 && !(e.cds.jam > 0) && this.enemyHas('Scout') && Math.random() < 0.4) {
      c.p.eff.jammed = 2; e.cds.jam = 4; ap--;
      this.log(`<span class="red">${U.esc(e.name)}</span> floods your sensors with ECM (-2 dice)`); AudioEngine.play('radio');
    }
    const fleeing = !c.drill && e.hull < e.maxHull * 0.25 && e.aggro < 150;
    let guard = 0;
    while (ap > 0 && this.c && !c.over && guard++ < 10) {
      if (fleeing) {
        if (c.e.x === this.COLS - 1) {
          const r = Dice.roll(2 + Math.floor(e.piloting / 2), 4); ap = 0;
          if (r.hits >= 2) { this.log(`<span class="red">${U.esc(e.name)}</span> breaks off and jumps away ${Dice.html(r)}`); AudioEngine.play('warp'); this.busy = false; return this.end('enemyFled'); }
          this.log(`<span class="red">${U.esc(e.name)}</span> tries to flee ${Dice.html(r)} → fails`);
          break;
        }
        if (!this.enemyStep((x) => this.COLS - 1 - x)) break;
        ap--; AudioEngine.play('thrust'); ArtAndUIController.render(); await U.sleep(300);
        continue;
      }
      const d = this.dist();
      const ready = e.weapons.filter(w => w.ready === 0 && !w.fired);
      const inRange = ready.filter(w => d >= w.rmin && d <= w.rmax).sort((a, b) => b.dmg - a.dmg);
      if (inRange.length) { await this.enemyFire(inRange[0]); ap--; await U.sleep(420); continue; }
      if (!ready.length) break;
      const best = ready.sort((a, b) => b.dmg - a.dmg)[0];
      const desired = d > best.rmax ? best.rmax : best.rmin;
      if (!this.enemyStep((x, y) => Math.abs(U.cheb({ x, y }, c.p) - desired))) break;
      ap--; AudioEngine.play('thrust'); ArtAndUIController.render(); await U.sleep(300);
    }
    if (!this.c || c.over) { this.busy = false; return; }
    e.weapons.forEach(w => { w.fired = false; if (w.ready > 0) w.ready--; });
    Object.keys(e.cds).forEach(k => { if (e.cds[k] > 0) e.cds[k]--; });
    this.busy = false;
    this.startPlayerTurn();
  },

  // ---------------- Boarding / crew combat ----------------
  startBoarding(bonus) {
    const c = this.c, S = GameEngine.state, st = GameEngine.shipStats();
    const party = S.crew.filter(x => x.hp > 0).sort((a, b) => b.skills.combat - a.skills.combat).slice(0, 4);
    const mk = (ref, side) => ({ id: U.uid(), ref, side, name: ref.name, job: ref.job, seed: ref.seed, hp: ref.hp, maxHp: GameEngine.crewMaxHp(ref), combat: ref.skills.combat, cds: {}, buff: side === 'p' ? bonus : 0, stunned: false, exposed: 0 });
    const units = [...party.map(x => mk(x, 'p')), ...c.enemy.crew.filter(x => x.hp > 0).map(x => mk(x, 'e'))];
    const order = units.map(u => ({ u, init: u.combat + 1 + Math.floor(Math.random() * 6) })).sort((a, b) => b.init - a.init).map(o => o.u);
    c.boarding = { units, order, idx: -1, round: 1, sel: null, boardBonus: st.board };
    AudioEngine.play('boarding');
    this.log(`<b class="gold">BOARDING ACTION</b> - ${party.length} crew breach the hull of ${U.esc(c.enemy.name)}`);
    if (!units.some(u => u.side === 'e')) return this.endBoarding('captured');
    this.nextActor();
  },
  current() { const b = this.c && this.c.boarding; return b ? b.order[b.idx] : null; },
  boardingOver() {
    const b = this.c.boarding;
    const pA = b.units.some(u => u.side === 'p' && u.hp > 0), eA = b.units.some(u => u.side === 'e' && u.hp > 0);
    if (!eA) { this.endBoarding('captured'); return true; }
    if (!pA) { this.endBoarding('repelled'); return true; }
    return false;
  },
  nextActor() {
    const c = this.c; if (!c || !c.boarding) return;
    if (this.boardingOver()) return;
    const b = c.boarding;
    for (let guard = 0; guard < 40; guard++) {
      b.idx++;
      if (b.idx >= b.order.length) {
        b.idx = 0; b.round++;
        b.units.forEach(u => { Object.keys(u.cds).forEach(k => { if (u.cds[k] > 0) u.cds[k]--; }); if (u.exposed > 0) u.exposed--; });
      }
      const u = b.order[b.idx];
      if (u.hp <= 0) continue;
      if (u.stunned) { u.stunned = false; this.log(`<span class="dim">${U.esc(u.name)} is stunned and loses the action</span>`); continue; }
      break;
    }
    b.sel = null;
    ArtAndUIController.render();
    const u = this.current();
    if (u && u.side === 'e') setTimeout(() => this.enemyCrewAct(u), 700);
  },
  crewPool(u) { return 2 + Math.floor(u.combat / 2) + u.buff + (u.side === 'p' ? this.c.boarding.boardBonus : 0); },
  crewAttack(u, t, extra = 0, critOn = 6) {
    const r = Dice.roll(this.crewPool(u) + extra, 4 - (t.exposed ? 1 : 0), critOn);
    u.buff = 0;
    const dmg = r.hits ? 3 + r.hits * 3 + r.crits * 2 : 0;
    t.hp = Math.max(0, t.hp - dmg);
    AudioEngine.play(dmg ? 'impact' : 'miss');
    const col = u.side === 'p' ? 'cy' : 'red';
    this.log(`<span class="${col}">${U.esc(u.name)}</span> → ${U.esc(t.name)} ${Dice.html(r)} ${dmg ? `<b>${dmg} dmg</b>${t.hp <= 0 ? ' <b class="red">DOWN</b>' : ''}` : '<span class="dim">parried</span>'}`);
    return r;
  },
  crewActState(u, actId) { const A = CREW_ACTS[actId]; return { A, cd: u.cds[actId] || 0, usable: !(u.cds[actId] > 0) }; },
  playerCrewAction(actId, targetId) {
    const c = this.c, b = c && c.boarding, u = this.current();
    if (!b || !u || u.side !== 'p') return;
    const A = CREW_ACTS[actId]; if (!A || (u.cds[actId] || 0) > 0) return;
    const t = b.units.find(x => x.id === targetId);
    if (A.target === 'enemy' && (!t || t.side !== 'e' || t.hp <= 0)) return;
    if (A.target === 'ally' && (!t || t.side !== 'p' || t.hp <= 0)) return;
    this.doCrewAction(u, actId, t);
    if (u.side === 'p') GameEngine.addXp(u.ref, 3);
    this.nextActor();
  },
  doCrewAction(u, actId, t) {
    const b = this.c.boarding, A = CREW_ACTS[actId], side = u.side, foes = b.units.filter(x => x.side !== side && x.hp > 0);
    switch (actId) {
      case 'strike': this.crewAttack(u, t); break;
      case 'aimed': this.crewAttack(u, t, 3, 5); break;
      case 'stun': { const r = this.crewAttack(u, t, -1); if (r.hits && t.hp > 0) { t.stunned = true; this.log(`<span class="gold">${U.esc(t.name)} is stunned</span>`); } break; }
      case 'cleave': {
        this.crewAttack(u, t);
        const other = foes.filter(x => x !== t && x.hp > 0);
        if (other.length) this.crewAttack(u, other[Math.floor(Math.random() * other.length)], -1);
        break;
      }
      case 'patch': { const h = Math.ceil(t.maxHp * 0.5); t.hp = Math.min(t.maxHp, t.hp + h); this.log(`<span class="grn">${U.esc(u.name)}</span> patches up ${U.esc(t.name)} (+${h} HP)`); AudioEngine.play('confirm'); break; }
      case 'rallyCry': b.units.filter(x => x.side === side && x.hp > 0).forEach(x => (x.buff += 2)); this.log(`<span class="gold">${U.esc(u.name)}</span> rallies the squad (+2 dice)`); AudioEngine.play('alert'); break;
      case 'flank': t.exposed = 2; this.log(`<span class="gold">${U.esc(u.name)}</span> orders a flank - ${U.esc(t.name)} exposed`); break;
    }
    if (A.cd) u.cds[actId] = A.cd;
    b.units.forEach(x => (x.ref.hp = x.hp));
  },
  enemyCrewAct(u) {
    const c = this.c; if (!c || !c.boarding || this.current() !== u) return;
    const b = c.boarding;
    const allies = b.units.filter(x => x.side === 'e' && x.hp > 0), foes = b.units.filter(x => x.side === 'p' && x.hp > 0);
    if (!foes.length) return this.nextActor();
    const special = JOBS[u.job].crewAct;
    const hurt = allies.filter(a => a.hp < a.maxHp * 0.4).sort((a, b2) => a.hp - b2.hp)[0];
    const target = foes.sort((a, b2) => a.hp - b2.hp)[0];
    if (special === 'patch' && hurt && !(u.cds.patch > 0)) this.doCrewAction(u, 'patch', hurt);
    else if (special !== 'patch' && !(u.cds[special] > 0) && Math.random() < 0.45) this.doCrewAction(u, special, target);
    else this.doCrewAction(u, 'strike', target);
    this.nextActor();
  },
  withdraw() {
    const u = this.current(); if (!u || u.side !== 'p') return;
    this.endBoarding('withdrawn');
  },
  endBoarding(outcome) {
    const c = this.c, b = c.boarding;
    b.units.forEach(x => (x.ref.hp = x.hp));
    c.boarding = null;
    if (outcome === 'captured') { this.log('<b class="grn">Enemy crew neutralized - vessel captured!</b>'); return this.end('captured'); }
    this.log(outcome === 'repelled' ? '<b class="red">Boarding party repelled!</b> Survivors drag themselves back aboard.' : '<span class="gold">Boarding party withdraws to the ship.</span>');
    c.ap = 0;
    ArtAndUIController.render();
    this.enemyTurn();
  },

  // ---------------- Resolution ----------------
  end(result) {
    const c = this.c; if (!c || c.over) return;
    c.over = true; c.result = result; c.phase = 'over'; this.busy = false;
    const S = GameEngine.state, e = c.enemy, st = GameEngine.shipStats(), sum = [];
    if (c.drill) {
      S.ship.hull = c.snapshot.hull;
      S.crew.forEach((x, i) => { if (c.snapshot.crew[i] != null) x.hp = c.snapshot.crew[i]; });
      S.crew.forEach(x => GameEngine.addXp(x, result === 'victory' || result === 'captured' ? 15 : 5));
      sum.push('Simulation terminated. Hull and crew vitals restored.', 'Crew gained training XP.');

    if (o.schematic) {

  // ---------------- SVG: graphic-novel crew portraits ----------------
  function characterTraits(seed) {
    const r = U.rng(seed >>> 0, 'character-identity'), roll = r();
    const species = roll < .55 ? 'human' : roll < .70 ? 'veyran' : roll < .85 ? 'kael' : 'robot';
    const female = r() < .28 && species !== 'robot';
    const name = { human: 'Human', veyran: 'Veyran', kael: 'Kael', robot: 'Robot' }[species];
    return { species, female, chassis: r() < .5 ? 'sentinel' : 'cyclops', label: species === 'robot' ? name : `${name} / ${female ? 'Female' : 'Male'}` };
  }

      Q103,53 78,63 L${L + 5},77 L${L + 3},98Z`;

      cap,

        L119,${top - 3} L115,65 L102,60 L100,${top + 4} Q77,44 ${L + 3},85Z`,

        L${R + 9},58 L${R - 4},81 L${R - 5},58 Q104,78 ${L + 9},89 L${L + 4},104Z`,
    ][style];

  // ---------------- View helpers ----------------
  const bar = (cls, v, max) => `<div class="bar ${cls}"><i style="width:${max ? U.clamp((v / max) * 100, 0, 100) : 0}%"></i></div>`;
  const statline = (label, v, max, cls = '') => `<div class="statline"><span class="dim">${label}</span>${bar(cls, v, max)}<span>${Math.round(v)}/${Math.round(max)}</span></div>`;
  const chip = (k, v, cls = '', id = '') => `<div class="chip bevel"><span class="k">${k}</span><b class="${cls}"${id ? ` id="${id}"` : ''}>${v}</b></div>`;
  const dangerStr = d => `<span style="color:${d >= 5 ? '#ff4d5e' : d >= 3 ? '#ffb547' : '#4dffa6'};letter-spacing:2px">${'■'.repeat(Math.min(d, 8))}${'□'.repeat(Math.max(0, 6 - d))}</span> <span class="dim">${d}</span>`;
  const esc = U.esc;

  // ---------------- Bridge ----------------
  function marketTable() {
    const S = GameEngine.state, pl = GameEngine.herePlanet();
    if (!pl.market) return '<div class="sub">No exchange on this world. Transit to another planet in-system.</div>';
    const t = GameEngine.worldTime();
    const ids = Array.from(new Set([...pl.marketList, ...Object.keys(S.ship.cargo).map(Number)])).sort((a, b) => a - b);
    const rows = ids.map(cid => {
      const c = COMMODITIES[cid], pi = GameEngine.priceInfo(S.system, S.planet, cid, t), listed = pl.marketList.includes(cid);
      const stock = listed ? GameEngine.stock(S.system, S.planet, cid, t) : 0, hold = S.ship.cargo[cid] || 0;
      const dist = Math.abs(pi.dist - 1) > 0.001 ? ` <span class="${pi.dist > 1 ? 'up' : 'down'}" title="Mesh market disturbance">ϟ${pi.dist.toFixed(2)}</span>` : '';
      const canSell = hold > 0 && (!c.contraband || listed);
      return `<tr><td><b>${c.short}</b> <span class="dim" style="font-family:var(--ui)">${c.name}</span>${c.contraband ? ' <span class="tag red">Illicit</span>' : ''}${dist}</td>
        <td class="num gold">${listed ? U.fmt(pi.buy) : '-'}</td><td class="num cy">${U.fmt(pi.sell)}</td><td class="num">${listed ? stock : '-'}</td><td class="num">${hold || ''}</td>
        <td>${pi.trend > 0 ? '<span class="up">▲</span>' : '<span class="down">▼</span>'}</td>
        <td style="white-space:nowrap">${listed ? `<button class="btn sm" data-act="buy" data-c="${cid}" data-q="1">+1</button> <button class="btn sm" data-act="buy" data-c="${cid}" data-q="10">+10</button>` : ''}
        ${canSell ? ` <button class="btn sm gold" data-act="sell" data-c="${cid}" data-q="1">-1</button> <button class="btn sm gold" data-act="sell" data-c="${cid}" data-q="${hold}">All</button>` : ''}</td></tr>`;
    }).join('');
    return `<div style="overflow-x:auto"><table class="data"><tr><th>Commodity</th><th class="num">Buy</th><th class="num">Sell</th><th class="num">Stock</th><th class="num">Hold</th><th>Trend</th><th></th></tr>${rows}</table></div>
      <div class="sub" style="margin-top:6px">Prices follow deterministic stardate cycles shared by every captain on seed 0x${U.hex(GameEngine.galaxy.seed)}. Trades of 15+ units broadcast a disturbance packet. Stock restocks every 6h.</div>`;
  }
  function viewBridge() {
    const S = GameEngine.state, sys = GameEngine.here(), pl = GameEngine.herePlanet(), T = PLANET_TYPES[pl.type], t = GameEngine.worldTime(), st = GameEngine.shipStats();
    const front = GameEngine.frontline(sys.id, t), danger = GameEngine.danger(sys.id, t), ghosts = GameEngine.ghostsInSystem(sys.id, t);
    const planets = sys.planets.map(p => `<button class="btn sm ${p.id === S.planet ? 'gold' : ''}" data-act="gotoPlanet" data-p="${p.id}">${U.roman(p.id)} · ${PLANET_TYPES[p.type].name}</button>`).join(' ');
    const services = [pl.market && 'Market', pl.shipyard && 'Shipyard', pl.tavern && 'Cantina'].filter(Boolean).map(s => `<span class="tag cy">${s}</span>`).join('') || '<span class="tag dim">Uninhabited</span>';
    const wanted = GameEngine.wanted();
    return `<div class="grid2"><div class="stack">
      <div class="bevel panel"><h2>${esc(pl.name)}</h2>
        <div id="planetSlot"><span class="hudtag" style="left:6px;top:4px">ORBIT // ${T.name}</span><span class="hudtag" style="right:6px;top:4px">${pl.rings ? 'RINGED // ' : ''}G${(pl.size * 1.4).toFixed(2)}</span>
        <span class="hudtag" style="left:6px;bottom:4px;color:${fc(sys.faction)}">${FACTIONS[sys.faction].short} TERRITORY</span><span class="hudtag" style="right:6px;bottom:4px">POP ${U.fmt(pl.pop)}M</span></div>
        <div class="row" style="margin-top:8px">${planets}</div></div>
      <div class="bevel panel"><h3>System Intel</h3><div class="kv">
        <span>System</span><span>${esc(sys.name)} ${sys.home ? '<span class="tag gold">Capital</span>' : ''}</span>
        <span>Faction</span><span style="color:${fc(sys.faction)}">${fname(sys.faction)}</span>
        <span>Danger</span><span>${dangerStr(danger)}</span>
        <span>War front</span><span>${front.intensity > 0 ? `<b class="red">ACTIVE vs ${fname(front.enemy)} (${Math.round(front.intensity * 100)}%)</b>` : '<span class="grn">Stable</span>'}</span>
        <span>Ghost contacts</span><span>${ghosts.length ? ghosts.map(g => `<span class="vio">${esc(GameEngine.ghostName(g.player))}</span>`).join(', ') : 'None detected'}</span>
        <span>Standing</span><span>${S.rep[sys.faction]}</span>
        <span>Services</span><span>${services}</span>
        ${wanted.length ? `<span>Status</span><span class="red"><b>WANTED</b> - ${U.fmt(wanted.reduce((a, b) => a + b.reward, 0))}cr on your head</span>` : ''}
      </div></div></div>
      <div class="stack">
      <div class="bevel panel"><h2>Port Services</h2><div class="row">
        ${pl.market ? `<button class="btn" data-act="refuel">◈ Refuel ${S.ship.fuel}/${st.fuel} (${GameEngine.fuelPrice()}cr/u)</button>` : ''}
        ${pl.shipyard ? `<button class="btn" data-act="repair" ${GameEngine.repairCost() <= 0 ? 'disabled' : ''}>⚙ Repair (${U.fmt(GameEngine.repairCost())}cr)</button><button class="btn" data-act="tab" data-tab="ship">Shipyard ›</button>` : ''}
        ${pl.tavern ? `<button class="btn" data-act="rest" ${GameEngine.restCost() ? '' : 'disabled'}>✚ Rest crew (${U.fmt(GameEngine.restCost())}cr · 8h)</button><button class="btn" data-act="tab" data-tab="crew">Cantina ›</button>` : ''}
        <button class="btn gold" data-act="tab" data-tab="map">Navigation ›</button><button class="btn" data-act="tab" data-tab="tactical">Holo-Drill ›</button></div>
        ${S.route.length ? `<div class="sub" style="margin-top:10px">Route: ${S.route.map(id => esc(GameEngine.sys(id).name)).join(' → ')} &nbsp;<button class="btn sm gold" data-act="jumpNext">Engage next jump ➤</button></div>` : ''}
      </div>
      <div class="bevel panel"><h2>Commodity Exchange</h2>${marketTable()}</div>
