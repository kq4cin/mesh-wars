<html lang="en">
<head>

<title>MESH WARS // Frontier Traders</title>

<style>
:root{
  --bg0:#04060b; --bg1:#0a0f1a; --bg2:#0e1626; --panel:rgba(9,15,27,.88); --panel2:rgba(14,24,42,.92);
  --line:#1d3a5a; --line2:#2b5a86; --cy:#38d9ff; --co:#3a7bff; --gold:#ffb547; --red:#ff4d5e; --grn:#4dffa6; --vio:#b07cff;
  --txt:#d4e9ff; --dim:#7390b3; --mono:Consolas,"Cascadia Mono","SF Mono",ui-monospace,monospace;
  --ui:Bahnschrift,"DIN Alternate","Segoe UI","Roboto Condensed",system-ui,sans-serif;
  --bev:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--txt);font-family:var(--ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#9be8ff 40%,transparent 75%);opacity:0;pointer-events:none;z-index:50;transition:opacity .5s}
#flash.on{opacity:.85;transition:opacity .08s}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr}
button{font-family:var(--ui);cursor:pointer}
.bevel{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));clip-path:polygon(var(--bev) 0,100% 0,100% calc(100% - var(--bev)),calc(100% - var(--bev)) 100%,0 100%,0 var(--bev));box-shadow:inset 0 0 0 1px var(--line),inset 0 0 24px rgba(56,217,255,.06)}
.bevel::before{content:"";position:absolute;left:0;top:0;width:calc(var(--bev) * 1.5);height:calc(var(--bev) * 1.5);background:linear-gradient(135deg,var(--cy) 0 2px,transparent 2px);opacity:.8;pointer-events:none}
.bevel::after{content:"";position:absolute;right:0;bottom:0;width:40px;height:2px;background:var(--gold);opacity:.7;pointer-events:none}
header#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,rgba(6,12,24,.96),rgba(6,12,24,.75));border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.22em;font-size:16px;color:#fff;text-shadow:0 0 12px var(--cy)}
.logo small{display:block;font-size:9px;letter-spacing:.35em;color:var(--gold);text-shadow:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.chip{--bev:6px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{color:#fff;font-family:var(--mono);font-weight:600}
.chip .k{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.gold{color:var(--gold)!important}.cy{color:var(--cy)!important}.red{color:var(--red)!important}.grn{color:var(--grn)!important}.vio{color:var(--vio)!important}.dim{color:var(--dim)!important}
.led{width:9px;height:9px;border-radius:50%;background:#444;box-shadow:0 0 0 1px #000}
.led.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}.led.sim{background:var(--vio);box-shadow:0 0 8px var(--vio)}.led.q{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.iconbtn{background:transparent;border:1px solid var(--line2);color:var(--cy);padding:4px 8px;font-size:12px;letter-spacing:.1em}
.iconbtn.off{color:var(--dim);border-color:var(--line)}
nav#tabs{display:flex;gap:2px;padding:6px 10px 0;background:rgba(4,8,16,.6);border-bottom:1px solid var(--line);overflow-x:auto}
nav#tabs button{background:linear-gradient(180deg,#0f1a2e,#0a1220);border:0;color:var(--dim);padding:9px 16px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);white-space:nowrap}
nav#tabs button.active{color:#fff;background:linear-gradient(180deg,#16365a,#0d1b30);box-shadow:inset 0 -2px 0 var(--cy)}
nav#tabs button .badge{background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:5px}
main#view{overflow:auto;padding:12px;min-height:0}
.grid2{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(320px,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tacgrid{display:grid;grid-template-columns:minmax(230px,280px) 1fr minmax(230px,280px);gap:12px}
@media (max-width:1100px){.tacgrid{grid-template-columns:1fr}}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px}
.panel{padding:14px 16px}
.panel h2,.panel h3{margin:0 0 10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--cy);display:flex;align-items:center;gap:8px}
.panel h2::after,.panel h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.panel h3{font-size:11px;color:var(--gold)}
.sub{color:var(--dim);font-size:12px;line-height:1.5}
.btn{background:linear-gradient(180deg,#14305a,#0c1d38);color:#e8f6ff;border:0;padding:7px 12px;font-size:12px;letter-spacing:.08em;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);box-shadow:inset 0 0 0 1px var(--line2);transition:filter .12s,transform .05s}
.btn:hover{filter:brightness(1.35)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(180deg,#6b4710,#3a260a);box-shadow:inset 0 0 0 1px #a8741f;color:#ffe2ae!important}
.btn.red{background:linear-gradient(180deg,#5e1520,#320a10);box-shadow:inset 0 0 0 1px #a0303e;color:#ffd0d6!important}
.btn.grn{background:linear-gradient(180deg,#0f4a33,#082a1d);box-shadow:inset 0 0 0 1px #2a9a6a;color:#d0ffe8!important}
.btn.sm{padding:4px 8px;font-size:11px}
.btn.wide{width:100%;margin-bottom:5px;text-align:left}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{text-align:left;color:var(--dim);font-weight:500;letter-spacing:.1em;font-size:10px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line2)}
table.data td{padding:5px 6px;border-bottom:1px solid rgba(29,58,90,.5);font-family:var(--mono)}
table.data tr:hover td{background:rgba(56,217,255,.05)}
.num{text-align:right}
.up{color:var(--red)}.down{color:var(--grn)}
.bar{height:8px;background:#0a1220;box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--co),var(--cy));transition:width .4s}
.bar.hull>i{background:linear-gradient(90deg,#b8501e,var(--gold))}.bar.hp>i{background:linear-gradient(90deg,#1e8a5a,var(--grn))}.bar.xp>i{background:linear-gradient(90deg,#5a2ea0,var(--vio))}
.statline{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;font-size:11px;margin:4px 0}
.statline span:last-child{text-align:right;font-family:var(--mono)}
#planetSlot{position:relative;aspect-ratio:1/1;width:min(100%,60vh);margin:auto}
#planetSlot canvas{width:100%;height:100%;display:block;object-fit:contain}
.hudtag{position:absolute;font-size:10px;letter-spacing:.25em;color:var(--cy);text-transform:uppercase;font-family:var(--mono);pointer-events:none}
.tag{display:inline-block;padding:1px 7px;font-size:10px;letter-spacing:.12em;border:1px solid currentColor;text-transform:uppercase;margin:0 4px 2px 0}
.crewgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr))}
.crewcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:12px;align-items:start}
.crewcard>div{min-width:0}
.crewcard svg{width:120px;height:144px}
.crewcard .spread{flex-wrap:wrap;gap:4px}
.crewcard .statline{grid-template-columns:28px minmax(20px,1fr) 52px}
.portrait-art{background:#08121e;box-shadow:0 6px 18px #0006}
@media(max-width:460px){.crewcard{grid-template-columns:88px minmax(0,1fr)}.crewcard svg{width:88px;height:106px}.crewcard .skills{gap:2px 8px;font-size:10px}}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:11px;margin-top:6px}
.skills div{display:flex;justify-content:space-between}
.skills b{font-family:var(--mono);color:#fff}
.sysnode{cursor:pointer}.sysnode:hover .core{stroke:#fff;stroke-width:2}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.95}}
.engineglow{animation:eng .35s ease-in-out infinite alternate}
@keyframes eng{from{opacity:.6}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.ship-art .engineglow{animation:none}}
.svgfit svg{width:100%;height:auto;display:block}
.cell{fill:rgba(20,40,70,.25);stroke:rgba(56,217,255,.12)}
.cell.move{fill:rgba(56,217,255,.16);stroke:rgba(56,217,255,.6);cursor:pointer}
.cell.move:hover{fill:rgba(56,217,255,.35)}
.beam{animation:beam .6s ease-out forwards}
@keyframes beam{0%{opacity:1;stroke-width:6}100%{opacity:0;stroke-width:1}}
.burst{animation:burst .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes burst{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
#clog{height:260px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.6;background:rgba(2,6,12,.6);padding:8px;box-shadow:inset 0 0 0 1px var(--line)}
#clog .e{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.die{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;margin:0 1px;font-weight:700;font-size:11px;border-radius:3px;background:#1a2a44;color:#7a90b0;animation:roll .5s ease-out backwards}
.die.hit{background:#0f4a7a;color:#bfeaff;box-shadow:0 0 6px rgba(56,217,255,.6)}
.die.crit{background:#7a5010;color:#fff1cc;box-shadow:0 0 8px rgba(255,181,71,.9)}
@keyframes roll{0%{transform:rotate(-200deg) scale(.3);opacity:0}70%{transform:rotate(15deg) scale(1.15)}100%{transform:none;opacity:1}}
.ap{display:inline-block;width:13px;height:13px;margin-right:5px;transform:rotate(45deg);background:#13263f;box-shadow:inset 0 0 0 1px var(--line2)}
.ap.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.unit{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:6px;margin-bottom:6px;cursor:pointer;--bev:8px}
.unit .spread{flex-wrap:wrap;gap:4px}
.board-parties{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.board-parties{grid-template-columns:1fr}}
.unit svg{width:54px;height:54px}
.unit.act{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(255,181,71,.4)}
.unit.down{opacity:.35;filter:grayscale(1);cursor:default}
.unit.tgt:hover{box-shadow:inset 0 0 0 2px var(--red)}
.bul{padding:7px 9px;border-left:3px solid var(--line2);margin-bottom:6px;background:rgba(10,20,36,.6);font-size:12px}
.bul.trade{border-color:var(--cy)}.bul.bounty{border-color:var(--gold)}.bul.signature{border-color:var(--vio)}
.bul code{font-family:var(--mono);color:var(--dim);font-size:10px;display:block;margin-top:3px;word-break:break-all}
.slot{--bev:8px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.slot.empty{opacity:.65}
input,select{background:#081120;color:var(--txt);border:1px solid var(--line2);padding:6px 8px;font-family:var(--mono);font-size:12px}
input[type=range]{padding:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#modal{position:fixed;inset:0;background:rgba(0,3,8,.72);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modalBox{max-width:660px;width:calc(100% - 30px);max-height:88vh;overflow:auto;padding:18px 20px;--bev:16px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none}
.toast{--bev:8px;padding:8px 14px;font-size:12px;animation:fadein .3s;max-width:360px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}.kv>span:nth-child(odd){color:var(--dim)}
.hex{font-family:var(--mono);font-size:11px;color:var(--cy);word-break:break-all}
.thumb{width:100%;height:108px;background:radial-gradient(ellipse at 50% 55%,#29496038,transparent 70%)}
#tutSpot{position:fixed;z-index:30;pointer-events:none;display:none;border:2px solid var(--cy);border-radius:4px;box-shadow:0 0 0 9999px rgba(0,3,8,.58),0 0 22px rgba(56,217,255,.7);transition:left .25s,top .25s,width .25s,height .25s;animation:tutglow 1.6s ease-in-out infinite}
@keyframes tutglow{50%{box-shadow:0 0 0 9999px rgba(0,3,8,.58),0 0 34px rgba(56,217,255,1)}}
#tutCard{position:fixed;z-index:31;display:none;width:min(390px,calc(100vw - 24px));padding:14px 16px;--bev:12px;box-shadow:inset 0 0 0 1px var(--cy),0 10px 40px rgba(0,0,0,.6)}
.thumb svg{width:100%;height:100%;display:block}
.unit svg,.crewcard svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1d3a5a}::-webkit-scrollbar-track{background:transparent}
</style>

<body>
<canvas id="bg"></canvas>
<div id="flash"></div>
<div id="app">
  <header id="top"></header>
  <nav id="tabs"></nav>
  <main id="view"></main>

<script>
'use strict';
// ============================================================================
// Shared utilities: deterministic PRNG, hashing, encoding, noise
// ============================================================================
const U = {
  mulberry32(a) {
    a >>>= 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  hash32(...vals) {
    let h = 0x811c9dc5;
    for (const v of vals) {
      const s = String(v);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
      h ^= 0x2c; h = Math.imul(h, 0x01000193);
    }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return h >>> 0;
  },
  rng(...v) { return U.mulberry32(U.hash32(...v)); },
  ri(r, a, b) { return a + Math.floor(r() * (b - a + 1)); },
  pick(r, arr) { return arr[Math.floor(r() * arr.length)]; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  fmt(n) { return Math.round(n).toLocaleString('en-US'); },
  hex(n, l = 8) { return (n >>> 0).toString(16).toUpperCase().padStart(l, '0'); },
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  b64e(bytes) { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/=+$/, ''); },
  b64d(str) {
    const pad = str.length % 4 ? '='.repeat(4 - (str.length % 4)) : '';
    const s = atob(str + pad); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },
  hexBytes(b, sep = ' ') { return Array.from(b, x => x.toString(16).padStart(2, '0')).join(sep).toUpperCase(); },
  $(sel, root = document) { return root.querySelector(sel); },
  $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); },
  now() { return Math.floor(Date.now() / 1000); },
  hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
  roman(n) { return ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][n] || String(n + 1); },
  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
  cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); },
  cheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); },
  fmtTime(sec) { const d = new Date(sec * 1000); return d.toISOString().replace('T', ' ').slice(0, 16); },
  le32(arr, off, v) { arr[off] = v & 255; arr[off + 1] = (v >>> 8) & 255; arr[off + 2] = (v >>> 16) & 255; arr[off + 3] = (v >>> 24) & 255; },
  rd32(arr, off) { return (arr[off] | (arr[off + 1] << 8) | (arr[off + 2] << 16) | (arr[off + 3] << 24)) >>> 0; },
  ago(sec) {
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return 'just now';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm ago';
    return Math.floor(sec / 86400) + 'd ago';
  },
  uid: (() => { let n = 0; return () => 'u' + (++n).toString(36); })(),
  sha256(msg) {
    if (!U._shaK) {
      const k = [], h = [], frac = x => ((x - Math.floor(x)) * 4294967296) >>> 0;
      for (let n = 2, c = 0; c < 64; n++) {
        let prime = true;
        for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
        if (!prime) continue;
        if (c < 8) h[c] = frac(Math.pow(n, 1 / 2));
        k[c++] = frac(Math.pow(n, 1 / 3));
      }
      U._shaK = k; U._shaH = h;
    }
    const K = U._shaK, H = U._shaH.slice(), l = msg.length, bl = ((l + 9 + 63) >> 6) << 6;
    const b = new Uint8Array(bl); b.set(msg); b[l] = 0x80;
    const dv = new DataView(b.buffer);
    dv.setUint32(bl - 4, (l * 8) >>> 0); dv.setUint32(bl - 8, Math.floor((l * 8) / 4294967296));
    const w = new Uint32Array(64), ror = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < bl; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = ror(w[i - 15], 7) ^ ror(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = ror(w[i - 2], 17) ^ ror(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, bb, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + bb) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer);
    H.forEach((v, i) => ov.setUint32(i * 4, v));
    return out;
  },
};

class Noise3 {
  constructor(seed) {
    const r = U.mulberry32(seed);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    this.p = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.p[i] = p[i & 255];
    this.v = new Float32Array(256);
    for (let i = 0; i < 256; i++) this.v[i] = r();
  }
  n3(x, y, z) {
    const P = this.p, V = this.v;
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const X = xi & 255, Y = yi & 255, Z = zi & 255;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const A = P[X] + Y, B = P[X + 1] + Y;
    const AA = P[A] + Z, AB = P[A + 1] + Z, BA = P[B] + Z, BB = P[B + 1] + Z;
    const x1 = V[P[AA]] + (V[P[BA]] - V[P[AA]]) * u;
    const x2 = V[P[AB]] + (V[P[BB]] - V[P[AB]]) * u;
    const x3 = V[P[AA + 1]] + (V[P[BA + 1]] - V[P[AA + 1]]) * u;
    const x4 = V[P[AB + 1]] + (V[P[BB + 1]] - V[P[AB + 1]]) * u;
    const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
    return y1 + (y2 - y1) * w;
  }
  fbm(x, y, z, oct = 5) {
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += a * this.n3(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; }
    return s / n;
  }
}

// ============================================================================
// StorageManager: IndexedDB schema, persistence, Service Worker + manifest
// ============================================================================
const StorageManager = (() => {
  const DB_NAME = 'meshwars-db', DB_VER = 1;
  const SCHEMA = {
    ship: { keyPath: 'id' },
    crew: { keyPath: 'id' },
    starmap: { keyPath: 'id' },
    outbox: { keyPath: 'qid', autoIncrement: true },
    bulletins: { keyPath: 'id' },
    meta: { keyPath: 'key' },
  };
  let db = null;
  const mem = {};
  Object.keys(SCHEMA).forEach(k => (mem[k] = new Map()));
  let memSeq = 1;
  let swStatus = 'pending';

  function open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return res(null); }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const [n, o] of Object.entries(SCHEMA)) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, o);
      };
      req.onsuccess = () => { db = req.result; res(db); };
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    });
  }
  function request(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r ? r.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  const clone = v => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));

  const SW_SOURCE = [
    "const CACHE='meshwars-shell-v1';",
    "self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']).catch(()=>{})).then(()=>self.skipWaiting()));});",
    "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});",
    "self.addEventListener('fetch',e=>{const q=e.request;if(q.method!=='GET')return;const u=new URL(q.url);if(u.origin!==location.origin)return;",
    "e.respondWith(fetch(q).then(r=>{const cp=r.clone();caches.open(CACHE).then(c=>c.put(q,cp));return r;}).catch(()=>caches.match(q,{ignoreSearch:true}).then(m=>m||caches.match('./'))));});",
    "function outboxCount(){return new Promise(res=>{let r;try{r=indexedDB.open('meshwars-db');}catch(x){return res(0);}",
    "r.onupgradeneeded=()=>{r.transaction.abort();};r.onerror=()=>res(0);",
    "r.onsuccess=()=>{const d=r.result;if(!d.objectStoreNames.contains('outbox')){d.close();return res(0);}",
    "const c=d.transaction('outbox','readonly').objectStore('outbox').count();c.onsuccess=()=>{res(c.result);d.close();};c.onerror=()=>{res(0);d.close();};};});}",
    "self.addEventListener('sync',e=>{if(e.tag==='mesh-outbox'){e.waitUntil(outboxCount().then(n=>self.clients.matchAll({includeUncontrolled:true}).then(cs=>cs.forEach(c=>c.postMessage({type:'flush-outbox',pending:n})))));}});",
    "self.addEventListener('message',e=>{if(e.data&&e.data.type==='outbox-count'){outboxCount().then(n=>e.source&&e.source.postMessage({type:'outbox-count',pending:n}));}});",
  ].join('\n');

  async function registerServiceWorker() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) {
      swStatus = 'unavailable (serve over http/https)';
      return swStatus;
    }
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'flush-outbox') window.dispatchEvent(new CustomEvent('mw-flush-outbox'));
    });
    const ctl = navigator.serviceWorker.controller;
    if (ctl && /\/sw\.js$/.test(ctl.scriptURL)) {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline: keep running worker */ });
      swStatus = 'active (sw.js)';
      return swStatus;
    }
    try {
      const r = await fetch('sw.js', { method: 'HEAD', cache: 'no-store' });
      if (r.ok && /javascript/.test(r.headers.get('content-type') || '')) {
        await navigator.serviceWorker.register('sw.js');
        swStatus = 'active (sw.js)';
        return swStatus;
      }
    } catch (e) { /* no sibling worker deployed */ }
    try {
      const url = URL.createObjectURL(new Blob([SW_SOURCE], { type: 'text/javascript' }));
      await navigator.serviceWorker.register(url);
      swStatus = 'active (inline blob worker)';
      return swStatus;
    } catch (e) { /* most engines reject blob: worker scripts; fall through */ }
    try {
      const c = await caches.open('meshwars-shell-v1');
      await c.add(new Request(location.href.split('#')[0], { cache: 'reload' }));
      swStatus = 'shell cached - export sw.js beside index.html for offline boot';
    } catch (e) { swStatus = 'cache unavailable'; }
    return swStatus;
  }

  function exportServiceWorker() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([SW_SOURCE], { type: 'text/javascript' }));
    a.download = 'sw.js';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function drawIcon(size) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'); const s = size / 64;
    const bg = g.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size * 0.7);
    bg.addColorStop(0, '#12305a'); bg.addColorStop(1, '#04060b');
    g.fillStyle = bg; g.fillRect(0, 0, size, size);
    g.strokeStyle = '#38d9ff'; g.lineWidth = 3 * s; g.shadowColor = '#38d9ff'; g.shadowBlur = 6 * s;
    g.beginPath(); [[32, 6], [56, 20], [56, 44], [32, 58], [8, 44], [8, 20]].forEach(([x, y], i) => (i ? g.lineTo(x * s, y * s) : g.moveTo(x * s, y * s))); g.closePath(); g.stroke();
    g.shadowColor = '#ffb547'; g.fillStyle = '#ffb547';
    g.beginPath(); [[18, 34], [32, 18], [46, 34], [38, 32], [32, 44], [26, 32]].forEach(([x, y], i) => (i ? g.lineTo(x * s, y * s) : g.moveTo(x * s, y * s))); g.closePath(); g.fill();
    return c.toDataURL('image/png');
  }

  async function installManifest() {
    // A deployed manifest + icon set (e.g. GitHub Pages) wins; the generated one keeps the lone HTML file installable.
    if (/^https?:$/.test(location.protocol)) {
      const ctl = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
      if (ctl && /\/sw\.js$/.test(ctl.scriptURL)) { U.$('#iconLink').href = 'icons/icon.svg'; return; }
      try {
        const r = await fetch('manifest.webmanifest', { method: 'HEAD', cache: 'no-store' });
        if (r.ok) { U.$('#iconLink').href = 'icons/icon.svg'; return; }
      } catch (e) { /* not deployed alongside a manifest */ }
    }
    const start = location.href.split('#')[0];
    const manifest = {
      name: 'MESH WARS: Frontier Traders', short_name: 'MeshWars', description: 'Offline-first space trading & tactics with MeshCore sync',
      start_url: start, scope: start.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any',
      background_color: '#05070d', theme_color: '#0a1424',
      icons: [{ src: drawIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: drawIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }],
    };
    U.$('#manifestLink').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    U.$('#iconLink').href = drawIcon(64);
  }

  const api = {
    async init() { await open(); return !!db; },
    usingIDB() { return !!db; },
    swStatus() { return swStatus; },
    registerServiceWorker, exportServiceWorker, installManifest,
    get(store, key) { if (!db) return Promise.resolve(mem[store].has(key) ? clone(mem[store].get(key)) : undefined); return request(store, 'readonly', os => os.get(key)); },
    put(store, val) {
      if (!db) {
        const kp = SCHEMA[store].keyPath;
        if (val[kp] == null) val[kp] = memSeq++;
        mem[store].set(val[kp], clone(val));
        return Promise.resolve(val[kp]);
      }
      return request(store, 'readwrite', os => os.put(val));
    },
    del(store, key) { if (!db) { mem[store].delete(key); return Promise.resolve(); } return request(store, 'readwrite', os => os.delete(key)); },
    all(store) { if (!db) return Promise.resolve(Array.from(mem[store].values()).map(clone)); return request(store, 'readonly', os => os.getAll()); },
    count(store) { if (!db) return Promise.resolve(mem[store].size); return request(store, 'readonly', os => os.count()); },
    clear(store) { if (!db) { mem[store].clear(); return Promise.resolve(); } return request(store, 'readwrite', os => os.clear()); },
    replaceAll(store, vals) {
      if (!db) { mem[store].clear(); vals.forEach(v => mem[store].set(v[SCHEMA[store].keyPath], clone(v))); return Promise.resolve(); }
      return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite'); const os = tx.objectStore(store);
        os.clear(); vals.forEach(v => os.put(v));
        tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
      });
    },
    async wipe() { for (const k of Object.keys(SCHEMA)) await api.clear(k); },
  };
  return api;
})();

// AudioEngine: Web Audio synthesis for SFX, ambient pads, bridge atmosphere

const AudioEngine = (() => {

  const CHORDS = [[0, 7, 12, 15, 19], [-4, 3, 8, 12, 16], [3, 10, 15, 19, 22], [-5, 2, 7, 10, 14], [-2, 5, 10, 14, 17]];
  const PENTA = [0, 3, 5, 7, 10, 12, 15, 19, 22, 24];

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = vol.music; musicBus.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = impulse(3.2, 2.4);
    const wet = ctx.createGain(); wet.gain.value = 0.45; musicBus.connect(conv); conv.connect(wet); wet.connect(master);
    const sfxSend = ctx.createGain(); sfxSend.gain.value = 0.12; sfxBus.connect(sfxSend); sfxSend.connect(conv);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    brownBuf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const b = brownBuf.getChannelData(0); let last = 0;
    for (let i = 0; i < b.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }

  function noise(t, dur, o = {}) {

    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + a + dur);

    click(t) { osc('square', 1900, t, 0.03, { peak: 0.05, f2: 900 }); osc('sine', 3400, t, 0.02, { peak: 0.03 }); },
    confirm(t) { osc('triangle', 660, t, 0.08, { peak: 0.14 }); osc('triangle', 990, t + 0.07, 0.12, { peak: 0.14 }); },

      if (!this.client || !this.client.ready || ch == null) return;
      const t = enc.encode(wire), f = new Uint8Array(7 + t.length);
      f[0] = 3; f[1] = 0; f[2] = ch & 255; U.le32(f, 3, U.now()); f.set(t, 7);
      await this.client.request(f, [0, 1], 1500);
      this.log('Sign-off broadcast');
    },
    async queue(bytes, label, kind = 'misc') {
      const wire = encodeWire(bytes);
      if (kind === 'sig') {
        // only the newest signature matters for presence; drop stale queued ones to save airtime
        for (const it of await StorageManager.all('outbox')) if (it.kind === 'sig') await StorageManager.del('outbox', it.qid);
      }
      await StorageManager.put('outbox', { wire, hex: U.hexBytes(bytes), label, kind, t: Date.now() });
      if (this.bc) this.bc.postMessage({ wire, ts: U.now() });
      this.log(`Queued ${label} (${bytes.length}B) ${wire}`);
      await this.refreshPending();
      if (this.client) this.flush();
      else if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        try { const reg = await navigator.serviceWorker.ready; if (reg.sync) await reg.sync.register('mesh-outbox'); } catch (e) { /* background sync unsupported */ }
      }
    },
    async flush() {
      if (!this.client || !this.client.ready || this.flushing) return;
      const ch = this.activeChannel();
      if (ch == null) { this.log(`Outbox held: no ${GAME_CHANNEL} channel on the radio yet`); return; }
      this.flushing = true;
      try {
        const items = (await StorageManager.all('outbox')).sort((a, b) => a.qid - b.qid);
        while (items.length && this.client) {
          const batch = []; let len = 0;
          while (items.length && (!batch.length || len + items[0].wire.length + 1 <= MAX_TEXT)) { const it = items.shift(); batch.push(it); len += it.wire.length + 1; }
          const text = batch.map(b => b.wire).join(' ');
          const t = enc.encode(text), f = new Uint8Array(7 + t.length);
          f[0] = 3; f[1] = 0; f[2] = ch & 255; U.le32(f, 3, U.now()); f.set(t, 7); // CMD_SEND_CHANNEL_TXT_MSG
          const r = await this.client.request(f, [0, 1], 5000);
          if (!r || r[0] === 1) throw new Error(r ? `radio rejected send on channel ${ch}` : 'no reply from radio');
          if (this.client && this.client.roomLogged && this.client.room) await this.client.sendDirect(this.client.room.pub, text);
          for (const b of batch) await StorageManager.del('outbox', b.qid);
          this.log(`TX ${batch.length} packet(s) on ch${ch}${this.client && this.client.roomLogged ? ' + room' : ''}`);
          await U.sleep(1200);
        }
      } catch (e) {
        this.log('Flush halted: ' + e.message + ' - packets remain queued');
      } finally {
        this.flushing = false;
        await this.refreshPending();
      }
    },
    ingestText(text, source, meta = {}) {
      const pk = decodeWire(text);
      pk.forEach(p => this.hooks.onPacket(p.packet, p.bytes, source, meta));
      if (pk.length && source !== 'sim') this.log(`RX ${pk.length} packet(s) via ${source}`);
    },
    pollRoom() { if (this.client) { this.client.pollRoom(); this.log('Polling room server / radio queue'); } },
  };

  return {
    SIZE, packTrade, packBounty, packSignature, unpack, encodeWire, decodeWire, encodeExpiry, decodeExpiry, crc16,
    GAME_CHANNEL, GAME_KEY, hashtagKey, SerialAdapter, BLEAdapter, MeshCoreClient, manager: M,
  };
})();
