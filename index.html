  // ---------------- Star map ----------------
  function viewMap() {
    const G = GameEngine.galaxy, S = GameEngine.state, t = GameEngine.worldTime();
    if (mapSel == null || !G.systems[mapSel]) mapSel = S.system;
    const k2 = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
    const routeSet = new Set(), path = [S.system, ...S.route];
    for (let i = 0; i < path.length - 1; i++) routeSet.add(k2(path[i], path[i + 1]));
    const defs = FACTIONS.map(F => `<radialGradient id="fg${F.id}"><stop offset="0" stop-color="${F.color}" stop-opacity=".22"/><stop offset="1" stop-color="${F.color}" stop-opacity="0"/></radialGradient>`).join('');
    const spheres = G.systems.map(s => `<circle cx="${s.x.toFixed(0)}" cy="${s.y.toFixed(0)}" r="${s.home ? 135 : 95}" fill="url(#fg${s.faction})"/>`).join('');
    const lanes = G.lanes.map(([a, b]) => {
      const A = G.systems[a], B = G.systems[b], on = routeSet.has(k2(a, b)), here = a === S.system || b === S.system;
      return `<line x1="${A.x.toFixed(0)}" y1="${A.y.toFixed(0)}" x2="${B.x.toFixed(0)}" y2="${B.y.toFixed(0)}" stroke="${on ? '#ffb547' : here ? '#38d9ff' : '#2b5a86'}" stroke-opacity="${on || here ? 0.9 : 0.45}" stroke-width="${on ? 2.6 : 1.2}"${here && !on ? ' stroke-dasharray="5 4"' : ''}/>`;
    }).join('');
    const fronts = G.systems.filter(s => GameEngine.frontline(s.id, t).intensity > 0).map(s => `<circle class="pulse" cx="${s.x.toFixed(0)}" cy="${s.y.toFixed(0)}" r="17" fill="none" stroke="#ff4d5e" stroke-width="2"/>`).join('');
    const gCount = {};
    Object.values(S.ghosts).forEach(g => { const id = GameEngine.ghostSystem(g.player, t); gCount[id] = (gCount[id] || 0) + 1; });
    const ghostM = Object.entries(gCount).map(([id, n]) => { const s = G.systems[id]; return `<g><path d="M${(s.x + 13).toFixed(0)},${(s.y - 19).toFixed(0)} l6,6 l-6,6 l-6,-6z" fill="#b07cff" stroke="#05070d"/>${n > 1 ? `<text x="${(s.x + 22).toFixed(0)}" y="${(s.y - 10).toFixed(0)}" font-size="10" fill="#b07cff" font-family="Consolas,monospace">${n}</text>` : ''}</g>`; }).join('');
    const bountyM = S.bounties.map(b => {
      const s = G.systems[b.target === S.playerHash ? S.system : GameEngine.ghostSystem(b.target, t)];
      const x = s.x - 16, y = s.y - 16;
      return `<g stroke="#ffb547" stroke-width="1.5" fill="none"><circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="5"/><path d="M${(x - 8).toFixed(0)},${y.toFixed(0)} h16 M${x.toFixed(0)},${(y - 8).toFixed(0)} v16"/></g>`;
    }).join('');
    const dCount = {};
    S.disturbances.forEach(d => { if (d.expiry > U.now()) dCount[d.sector] = (dCount[d.sector] || 0) + 1; });
    const distM = Object.keys(dCount).map(id => { const s = G.systems[id]; return s ? `<text x="${(s.x + 11).toFixed(0)}" y="${(s.y + 16).toFixed(0)}" font-size="12" fill="#38d9ff">ϟ</text>` : ''; }).join('');
    const nodes = G.systems.map(s => {
      const r = 4.5 * s.starSize, vis = S.visited[s.id] != null, x = s.x.toFixed(0), y = s.y.toFixed(0);
      return `<g class="sysnode" data-act="selSys" data-s="${s.id}"><circle cx="${x}" cy="${y}" r="${(r * 3.4).toFixed(1)}" fill="${s.star}" opacity=".15"/>
        <circle class="core" cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${s.star}" stroke="${fc(s.faction)}" stroke-width="1.3"/>
        ${s.home ? `<rect x="${(s.x - r - 4).toFixed(1)}" y="${(s.y - r - 4).toFixed(1)}" width="${(2 * r + 8).toFixed(1)}" height="${(2 * r + 8).toFixed(1)}" fill="none" stroke="${fc(s.faction)}" stroke-opacity=".75" transform="rotate(45 ${x} ${y})"/>` : ''}
        <text x="${x}" y="${(s.y + r + 14).toFixed(0)}" text-anchor="middle" font-size="11" fill="${vis ? '#d4e9ff' : '#6f8bab'}" font-family="Bahnschrift,Segoe UI,sans-serif">${esc(s.name)}</text></g>`;
    }).join('');
    const H = G.systems[S.system], SS = G.systems[mapSel];
    const deco = `<g pointer-events="none">${fronts}${ghostM}${bountyM}${distM}<circle class="spin" cx="${H.x.toFixed(0)}" cy="${H.y.toFixed(0)}" r="13" fill="none" stroke="#38d9ff" stroke-width="2" stroke-dasharray="6 4"/><circle cx="${SS.x.toFixed(0)}" cy="${SS.y.toFixed(0)}" r="20" fill="none" stroke="#ffb547" stroke-width="1.5" stroke-dasharray="3 3"/></g>`;
    const svg = `<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs><g pointer-events="none">${spheres}${lanes}</g>${nodes}${deco}</svg>`;
    // selection panel
    const s = SS, front = GameEngine.frontline(s.id, t), adj = G.adj[S.system].includes(s.id), route = GameEngine.route(s.id);
    const plist = s.planets.map(p => `<div class="spread" style="font-size:12px;margin:3px 0"><span>${esc(p.name)} <span class="dim">${PLANET_TYPES[p.type].name}</span></span><span>${p.market ? '<span class="tag cy">Mkt</span>' : ''}${p.shipyard ? '<span class="tag gold">Yard</span>' : ''}${p.tavern ? '<span class="tag grn">Bar</span>' : ''}</span></div>`).join('');
    let actions = '';
    if (s.id === S.system) actions = '<span class="tag cy">Current location</span>';
    else {
      if (adj) actions += `<button class="btn gold" data-act="jumpTo" data-s="${s.id}">Jump ➤ (${GameEngine.fuelCost(S.system, s.id)} fuel · ${GameEngine.travelHours(S.system, s.id)}h)</button> `;
      if (route.length > 1) actions += `<button class="btn" data-act="plot" data-s="${s.id}">Plot route (${route.length} jumps)</button> `;
      if (S.route.length && S.route[S.route.length - 1] === s.id && !adj) actions += `<button class="btn gold" data-act="jumpNext">Engage next jump ➤ ${esc(GameEngine.sys(S.route[0]).name)}</button>`;
    }
    const neigh = G.adj[S.system].map(n => `<button class="btn sm" data-act="selSys" data-s="${n}">${esc(G.systems[n].name)}</button>`).join(' ');
    return `<div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(280px,340px)">
      <div class="bevel panel"><h2>Star Map // Sector 0x${U.hex(G.seed)}</h2><div class="svgfit">${svg}</div>
        <div class="row sub" style="margin-top:6px"><span class="cy">◌ you</span><span class="gold">◇ capital</span><span class="red">◯ war front</span><span class="vio">◆ ghost fleet</span><span class="gold">⌖ bounty</span><span class="cy">ϟ market disturbance</span>
        ${FACTIONS.map(F => `<span style="color:${F.color}">● ${F.short}</span>`).join('')}</div></div>
      <div class="stack"><div class="bevel panel"><h2>${esc(s.name)}</h2><div class="kv">
        <span>Faction</span><span style="color:${fc(s.faction)}">${fname(s.faction)}</span>
        <span>Danger</span><span>${dangerStr(GameEngine.danger(s.id, t))}</span>
        <span>War</span><span>${front.intensity > 0 ? `<span class="red">vs ${fname(front.enemy)}</span>` : '<span class="grn">Stable</span>'}</span>
        <span>Visited</span><span>${S.visited[s.id] ? U.fmtTime(S.visited[s.id]) : 'Uncharted'}</span>
        <span>Distance</span><span>${s.id === S.system ? '-' : route.length ? route.length + ' jump(s)' : 'unreachable'}</span>
        <span>Ghosts</span><span>${GameEngine.ghostsInSystem(s.id, t).length}</span></div>
        <h3 style="margin-top:12px">Worlds</h3>${plist}<div class="row" style="margin-top:12px">${actions}</div></div>
        <div class="bevel panel"><h3>Lanes from ${esc(H.name)}</h3><div class="row">${neigh}</div>
        <div class="sub" style="margin-top:8px">Fuel ${S.ship.fuel}/${GameEngine.shipStats().fuel}. Jumps take ship-time; markets and war fronts evolve with the stardate.</div></div></div></div>`;
  }

  // ---------------- Ship ----------------
  function viewShip() {
    const S = GameEngine.state, st = GameEngine.shipStats(), H = HULLS[S.ship.hullType], pl = GameEngine.herePlanet(), yard = pl.shipyard;
    const sig = MeshProtocol.packSignature(GameEngine.signature()), pm = GameEngine.priceMod();
    const wslots = S.ship.modules.w.map((id, i) => {
      const w = id && W_BY_ID[id];
      return `<div class="slot bevel ${w ? '' : 'empty'}"><div><b class="red">W${i + 1}</b> ${w ? `${w.name}<div class="sub">DMG ${w.dmg} · ACC ${w.acc >= 0 ? '+' : ''}${w.acc} · RNG ${w.rmin}-${w.rmax} · PIERCE ${w.pierce} · vs SHIELD x${w.shieldMul}${w.cd ? ` · CD ${w.cd}` : ''}</div>` : '<span class="dim">Empty hardpoint</span>'}</div>${w && yard ? `<button class="btn sm red" data-act="uninstall" data-k="w" data-i="${i}">Sell +${U.fmt(w.price * 0.5)}</button>` : ''}</div>`;
    }).join('');
    const uslots = S.ship.modules.u.map((id, i) => {
      const m = id && U_BY_ID[id];
      return `<div class="slot bevel ${m ? '' : 'empty'}"><div><b class="grn">U${i + 1}</b> ${m ? `${m.name}<div class="sub">${m.desc}</div>` : '<span class="dim">Empty utility bay</span>'}</div>${m && yard ? `<button class="btn sm red" data-act="uninstall" data-k="u" data-i="${i}">Sell +${U.fmt(m.price * 0.5)}</button>` : ''}</div>`;
    }).join('');
    let yardHtml;
    if (yard) {
      const wfree = S.ship.modules.w.includes(null), ufree = S.ship.modules.u.includes(null);
      const shop = `<table class="data"><tr><th>Module</th><th>Spec</th><th class="num">Price</th><th></th></tr>
        ${WEAPONS.map(w => `<tr><td class="red">${w.name}</td><td class="dim">D${w.dmg} R${w.rmin}-${w.rmax} P${w.pierce}</td><td class="num gold">${U.fmt(w.price * pm)}</td><td><button class="btn sm" data-act="install" data-k="w" data-id="${w.id}" ${wfree ? '' : 'disabled'}>Install</button></td></tr>`).join('')}
        ${UTILS.map(u => `<tr><td class="grn">${u.name}</td><td class="dim">${u.desc}</td><td class="num gold">${U.fmt(u.price * pm)}</td><td><button class="btn sm" data-act="install" data-k="u" data-id="${u.id}" ${ufree ? '' : 'disabled'}>Install</button></td></tr>`).join('')}</table>`;
      const hulls = GameEngine.yardHulls().map(ht => {
        const h = HULLS[ht], net = Math.round(h.price * pm - HULLS[S.ship.hullType].price * 0.6), cur = ht === S.ship.hullType;
        return `<div class="bevel panel" style="padding:10px"><div class="thumb">${shipSVG(ht, cur ? S.playerHash : S.playerHash ^ ht, { accent: fc(GameEngine.here().faction), slots: cur ? S.ship.modules : undefined })}</div>
          <div class="spread"><b>${h.name}</b>${cur ? '<span class="tag cy">Current</span>' : `<span class="gold">${net >= 0 ? '' : '+'}${U.fmt(Math.abs(net))}cr</span>`}</div>
          <div class="sub">${cur ? 'Current equipment shown' : 'Base hull preview; compatible modules transfer'}<br>Hull ${h.hull} · Shield ${h.shield} · Armor ${h.armor} · Eva ${h.evasion}<br>Cargo ${h.cargo} · Fuel ${h.fuel} · Crew ${h.crew} · W${h.wslots}/U${h.uslots}</div>
          ${cur ? '' : `<button class="btn sm gold" style="margin-top:6px" data-act="buyHull" data-h="${ht}">${net >= 0 ? 'Purchase (trade-in)' : 'Downgrade (refund)'}</button>`}</div>`;
      }).join('');
      yardHtml = `<div class="bevel panel"><h2>Shipyard // Modules</h2>${shop}</div><div class="bevel panel"><h2>Shipyard // Hulls</h2><div class="grid3" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${hulls}</div></div>`;
    } else {
      const yards = GameEngine.galaxy.systems.filter(s => s.planets.some(p => p.shipyard)).map(s => ({ s, d: s.id === S.system ? 0 : GameEngine.route(s.id).length || 99 })).sort((a, b) => a.d - b.d).slice(0, 5);
      yardHtml = `<div class="bevel panel"><h2>Refit Unavailable</h2><div class="sub">Module installation and hull trades require a shipyard. Nearest yards:</div>
        ${yards.map(y => `<div class="spread" style="margin-top:6px"><span>${esc(y.s.name)} <span class="dim">${y.d} jump(s)</span></span><button class="btn sm" data-act="plot" data-s="${y.s.id}">Plot</button></div>`).join('')}</div>`;
    }
    return `<div class="grid2"><div class="stack">
      <div class="bevel panel"><h2>${esc(S.ship.name)} // ${H.name}-class</h2>
        <div class="svgfit" style="max-width:640px;margin:auto">${shipSVG(S.ship.hullType, S.playerHash, { schematic: true, slots: S.ship.modules, accent: '#38d9ff' })}</div>
        <div class="sub" style="text-align:center;margin-bottom:12px">Live loadout / installed weapons and utility fittings appear on the hull, including in combat. W &amp; U callouts identify slots; paired utility assemblies represent one module. Selling a module removes its fittings.</div>
        ${statline('Hull', S.ship.hull, st.maxHull, 'hull')}${statline('Shields', st.maxShield, st.maxShield)}${statline('Fuel', S.ship.fuel, st.fuel)}${statline('Cargo', GameEngine.cargoUsed(), st.cargo)}
        <div class="kv" style="margin-top:8px"><span>Armor</span><span>${st.armor}</span><span>Evasion</span><span>${st.evasion} (+pilot)</span><span>Crew berths</span><span>${S.crew.length}/${st.crewMax}</span>
        <span>Combat rating</span><span class="gold">${GameEngine.rating()}</span><span>Aggression</span><span>${S.aggro}/255</span>
        <span>Signature</span><span class="hex">${U.hexBytes(sig)}</span></div></div>
      <div class="bevel panel"><h3>Cargo Manifest</h3>${Object.keys(S.ship.cargo).length ? Object.entries(S.ship.cargo).map(([c, q]) => `<div class="spread" style="font-size:12px"><span>${COMMODITIES[c].name}</span><b>${q}</b></div>`).join('') : '<div class="sub">Hold empty.</div>'}</div>
      </div><div class="stack">
      <div class="bevel panel"><h2>Hardpoints</h2>${wslots}<h3 style="margin-top:12px">Utility Bays</h3>${uslots}</div>${yardHtml}</div></div>`;
  }

  // ---------------- Crew ----------------
  function crewCard(c, hire) {
    const J = JOBS[c.job], T = TALENTS[J.talent], A = CREW_ACTS[J.crewAct], max = GameEngine.crewMaxHp(c);
    return `<div class="bevel crewcard">${avatarSVG(c.seed, c.job)}<div>
      <div class="spread"><b>${esc(c.name)}</b><span class="tag" style="color:${J.color}">${c.job}</span></div>
      <div class="sub character-identity">${characterTraits(c.seed).label}</div>
      <div class="sub">Lv ${c.level} · <span class="gold">${T.name}</span>: ${T.desc}<br>Boarding: <span class="cy">${A.name}</span> - ${A.desc}</div>
      ${statline('HP', c.hp, max, 'hp')}${hire ? '' : statline('XP', c.xp, c.level * 100, 'xp')}
      <div class="skills">${SKILLS.map(k => `<div><span class="dim">${U.cap(k)}</span><b>${c.skills[k]}</b></div>`).join('')}</div>
      <div class="row" style="margin-top:8px">${hire ? `<button class="btn gold sm" data-act="hire" data-id="${c.id}">Hire · ${U.fmt(c.cost)}cr</button>` : c.job !== 'Captain' ? `<button class="btn red sm" data-act="dismiss" data-id="${c.id}">Dismiss</button>` : '<span class="tag gold">Commanding Officer</span>'}</div>
      </div></div>`;
  }
  function viewCrew() {
    const S = GameEngine.state, pl = GameEngine.herePlanet(), st = GameEngine.shipStats();
    const recruits = pl.tavern ? GameEngine.tavernCandidates() : [];
    return `<div class="bevel panel" style="margin-bottom:12px"><h2>Crew Roster // ${S.crew.length}/${st.crewMax} berths</h2>
      <div class="sub">Each officer brings a ship-combat talent (with cooldown) and a boarding action. Skills feed dice pools: Gunnery for volleys, Piloting for evasion & escapes, Engineering for shield regen & salvage, Negotiation for parley.</div></div>
      <div class="grid3 crewgrid">${S.crew.map(c => crewCard(c, false)).join('')}</div>
      <div class="bevel panel" style="margin-top:12px"><h2>Cantina Recruits</h2>${pl.tavern ? (recruits.length ? '' : '<div class="sub">No one else is looking for work today.</div>') : '<div class="sub">No cantina at this port.</div>'}</div>
      ${recruits.length ? `<div class="grid3 crewgrid" style="margin-top:12px">${recruits.map(c => crewCard(c, true)).join('')}</div>` : ''}`;
  }

  // ---------------- Tactical ----------------
  function rockPoly(cx, cy, key) {
    const r = U.rng('rock', key), n = 9, pts = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, rr = 18 + r() * 12; pts.push(`${(cx + Math.cos(a) * rr).toFixed(1)},${(cy + Math.sin(a) * rr * 0.85).toFixed(1)}`); }
    return `<polygon points="${pts.join(' ')}" fill="url(#rockg)" stroke="#05070d" stroke-width="2"/><circle cx="${cx - 5}" cy="${cy - 4}" r="3" fill="#000" opacity=".3"/>`;
  }
  function gridSVG() {
    const c = CombatEngine.c, S = GameEngine.state, e = c.enemy, CS = 80, COLS = CombatEngine.COLS, ROWS = CombatEngine.ROWS, st = GameEngine.shipStats();
    const mset = new Set(CombatEngine.moveTargets().map(m => m.x + ',' + m.y));
    let cells = '', deco = '';
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const k = x + ',' + y, mv = mset.has(k);
      cells += `<rect class="cell ${mv ? 'move' : ''}" x="${x * CS + 1}" y="${y * CS + 1}" width="${CS - 2}" height="${CS - 2}"${mv ? ` data-act="move" data-x="${x}" data-y="${y}"` : ''}/>`;
      if (c.nebula.has(k)) deco += `<rect x="${x * CS + 1}" y="${y * CS + 1}" width="${CS - 2}" height="${CS - 2}" fill="url(#nebg)"/>`;
      if (c.rocks.has(k)) deco += rockPoly(x * CS + CS / 2, y * CS + CS / 2, k);
    }
    const P = pos => [pos.x * CS + CS / 2, pos.y * CS + CS / 2];
    const [px, py] = P(c.p), [ex, ey] = P(c.e), d = CombatEngine.dist();
    const shieldRing = (x, y, frac, col) => frac > 0 ? `<ellipse cx="${x}" cy="${y}" rx="38" ry="29" fill="${col}" fill-opacity="${(0.05 + frac * 0.08).toFixed(2)}" stroke="${col}" stroke-opacity="${(0.25 + frac * 0.5).toFixed(2)}" stroke-width="1.5"/>` : '';
    const evaRing = (x, y, on) => on ? `<circle class="spin" cx="${x}" cy="${y}" r="35" fill="none" stroke="#38d9ff" stroke-dasharray="4 6" stroke-width="1.5"/>` : '';
    const now = performance.now();
    const fx = fxList.filter(f => now - f.t < 700).map(f => {
      const [x1, y1] = P(f.from), [x2, y2] = P(f.to), jx = f.hit ? 0 : 26, jy = f.hit ? 0 : -18, delay = -(now - f.t) | 0;
      return `<line class="beam" style="animation-delay:${delay}ms" x1="${x1}" y1="${y1}" x2="${x2 + jx}" y2="${y2 + jy}" stroke="${f.color}" stroke-linecap="round"/>${f.hit ? `<circle class="burst" style="animation-delay:${delay}ms" cx="${x2}" cy="${y2}" r="16" fill="${f.color}" fill-opacity=".5" stroke="#fff"/>` : ''}`;
    }).join('');
    return `<svg viewBox="0 0 ${COLS * CS} ${ROWS * CS}" xmlns="http://www.w3.org/2000/svg"><defs>
      <radialGradient id="rockg" cx=".35" cy=".35"><stop offset="0" stop-color="#7a7068"/><stop offset="1" stop-color="#2a2420"/></radialGradient>
      <radialGradient id="nebg"><stop offset="0" stop-color="#b07cff" stop-opacity=".28"/><stop offset="1" stop-color="#b07cff" stop-opacity=".04"/></radialGradient></defs>
      ${cells}<g pointer-events="none">${deco}
      <line x1="${px}" y1="${py}" x2="${ex}" y2="${ey}" stroke="#ffb547" stroke-opacity=".35" stroke-dasharray="3 6"/>
      <text x="${(px + ex) / 2}" y="${(py + ey) / 2 - 6}" fill="#ffb547" font-size="13" text-anchor="middle" font-family="Consolas,monospace">R${d}</text>
      ${shieldRing(px, py, c.pShield / Math.max(1, st.maxShield), '#38d9ff')}${evaRing(px, py, c.p.eff.evasive)}
      ${shipSVG(S.ship.hullType, S.playerHash, { x: px - 38, y: py - 30, w: 76, h: 60, accent: '#38d9ff', slots: S.ship.modules })}
      ${shieldRing(ex, ey, e.shield / Math.max(1, e.maxShield), '#ff4d5e')}${evaRing(ex, ey, c.e.eff.evasive)}
      ${shipSVG(e.hullType, e.seed, { x: ex - 38, y: ey - 30, w: 76, h: 60, accent: '#ff4d5e', tint: '#8a6a72', stripe: fc(e.faction), flip: true, slots: combatShipSlots(e) })}
      ${fx}</g></svg>`;
  }
  const effTags = eff => Object.entries(eff).filter(([, v]) => v).map(([k, v]) => `<span class="tag ${k === 'exposed' || k === 'jammed' ? 'red' : 'cy'}">${k}${typeof v === 'number' ? ' ' + v : ''}</span>`).join('');
  function boardingView() {
    const c = CombatEngine.c, b = c.boarding, cur = CombatEngine.current(), mine = cur && cur.side === 'p';
    const sel = b.sel ? CREW_ACTS[b.sel] : null;
    const card = u => {
      const tgt = mine && u.hp > 0 && ((!sel && u.side === 'e') || (sel && sel.target === 'enemy' && u.side === 'e') || (sel && sel.target === 'ally' && u.side === 'p'));
      return `<div class="bevel unit ${u === cur ? 'act' : ''} ${u.hp <= 0 ? 'down' : ''} ${tgt ? 'tgt' : ''}"${tgt ? ` data-act="crewTarget" data-u="${u.id}"` : ''}>${avatarSVG(u.seed, u.job)}<div>
        <div class="spread"><b style="font-size:12px">${esc(u.name)}</b><span class="tag" style="color:${JOBS[u.job].color}">${u.job}</span></div>
        <div class="sub character-identity">${characterTraits(u.seed).label}</div>
        ${statline('HP', u.hp, u.maxHp, 'hp')}<div class="sub">${u.stunned ? '<span class="gold">STUNNED </span>' : ''}${u.exposed ? '<span class="red">EXPOSED </span>' : ''}${u.buff ? `<span class="cy">+${u.buff} dice</span>` : ''}</div></div></div>`;
    };
    let acts = '';

      const ids = ['strike', JOBS[cur.job].crewAct];
      acts = ids.map(a => { const s = CombatEngine.crewActState(cur, a); return `<button class="btn ${b.sel === a ? 'gold' : ''}" data-act="crewAct" data-a="${a}" ${s.usable ? '' : 'disabled'} title="${s.A.desc}">${s.A.name}${s.cd ? ` (CD ${s.cd})` : ''}</button>`; }).join(' ') + ' <button class="btn red" data-act="withdraw">Withdraw</button>';
    }
    return `<div class="bevel panel"><h2>Boarding Action // Round ${b.round}</h2>
      <div class="sub" style="margin-bottom:8px">${mine ? (sel ? `Select a ${sel.target === 'ally' ? 'crewmate' : 'hostile'} for <b class="gold">${sel.name}</b>.` : `<b class="gold">${esc(cur.name)}</b> acts - choose an action or click a hostile to Strike.`) : '<span class="red">Hostile crew acting...</span>'}</div>
      <div class="row" style="margin-bottom:10px">${acts}</div>
      <div class="grid2 board-parties"><div><h3>Boarding Party</h3>${b.units.filter(u => u.side === 'p').map(card).join('')}</div><div><h3>Defenders</h3>${b.units.filter(u => u.side === 'e').map(card).join('')}</div></div></div>`;
  }
  function viewTactical() {
    const c = CombatEngine.c;
    if (!c) {
      return `<div class="grid2"><div class="bevel panel"><h2>Tactical Command</h2><div class="sub">No hostile contacts on scope. Run a holographic drill to train your crew - hull and crew vitals are restored afterwards.</div>
        <div class="row" style="margin-top:12px"><button class="btn" data-act="drill" data-t="1">Cadet Drill · T1</button><button class="btn gold" data-act="drill" data-t="3">Veteran Drill · T3</button><button class="btn red" data-act="drill" data-t="6">Ace Drill · T6</button></div></div>
        <div class="bevel panel"><h2>Rules of Engagement</h2><div class="sub">
        • Each turn you have <b class="gold">3 AP</b> (4 with an elite pilot). Move 1 cell, fire a weapon, or trigger an officer talent for 1 AP.<br>
        • Volleys roll a <b>dice pool</b>: 2 + Gunnery/2 + weapon accuracy + sensors. Each die ≥ TN hits; TN rises with target evasion and long range. 6s are crits.<br>
        • Shields absorb first (lasers excel), armor reduces hull damage (railguns pierce). Nebulae grant +1 evasion; asteroids block movement.<br>
        • Talents have cooldowns. Board at range 1 (2 AP) or with Breaching Pods at range 2 to start crew combat - capture yields 1.8x loot and a salvaged weapon.<br>
        • Flee from the left edge or at range 5+ with a Piloting check (2 AP).</div></div></div>`;

      return `<button class="btn wide" data-act="fire" data-i="${i}" ${ws.usable ? '' : 'disabled'}>⌁ ${ws.w.name} <span class="dim">R${ws.w.rmin}-${ws.w.rmax} D${ws.w.dmg}</span> ${stt}</button>`;

    return `<div class="tacgrid"><div class="stack">
      <div class="bevel panel"><h2>${esc(S.ship.name)}</h2><div class="thumb">${shipSVG(S.ship.hullType, S.playerHash, { accent: '#38d9ff', slots: S.ship.modules })}</div>
        ${statline('Hull', S.ship.hull, st.maxHull, 'hull')}${statline('Shield', c.pShield, st.maxShield)}
        <div class="kv"><span>Evasion</span><span>${CombatEngine.evasion('p')}</span><span>Armor</span><span>${CombatEngine.armor('p')}</span><span>Effects</span><span>${effTags(c.p.eff) || '-'}</span></div>
        <div style="margin:10px 0 4px" class="spread"><span class="dim">ACTION POINTS</span><span>${ap}</span></div></div>
      <div class="bevel panel"><h3>Weapons</h3>${weapons || '<div class="sub">No weapons installed!</div>'}</div>
      <div class="bevel panel"><h3>Officer Talents</h3>${talents}</div>

        <button class="btn" data-act="flee" ${CombatEngine.canFlee() ? '' : 'disabled'}>Flee (2AP)</button>
        <button class="btn gold" data-act="endTurn" ${my && !CombatEngine.busy ? '' : 'disabled'}>End Turn ➤</button></div></div></div>
      <div class="stack">${c.boarding ? boardingView() : `<div class="bevel panel"><h2>Tactical Grid // Turn ${c.turn} // <span class="${c.phase === 'player' ? 'grn' : 'red'}">${c.phase === 'player' ? 'YOUR MOVE' : c.phase === 'enemy' ? 'ENEMY MOVE' : 'RESOLVED'}</span></h2><div class="svgfit">${gridSVG()}</div><div class="sub" style="margin-top:6px">Click a highlighted cell to maneuver. Violet = nebula (+1 evasion). Rocks block movement.</div></div>`}
        <div class="bevel panel"><h3>Combat Log</h3><div id="clog">${logHtml}</div></div></div>
      <div class="stack"><div class="bevel panel"><h2 style="color:#ff8a96">${esc(e.name)}</h2><div class="thumb">${shipSVG(e.hullType, e.seed, { accent: '#ff4d5e', tint: '#8a6a72', stripe: fc(e.faction), flip: true, slots: combatShipSlots(e) })}</div>
        <div class="sub">${HULLS[e.hullType].name} · Tier ${e.tier} · ${e.kind === 'ghost' ? '<span class="vio">Ghost replica</span>' : fname(e.faction)}</div>
        ${statline('Hull', e.hull, e.maxHull, 'hull')}${statline('Shield', e.shield, e.maxShield)}
        <div class="kv"><span>Evasion</span><span>${CombatEngine.evasion('e')}</span><span>Armor</span><span>${CombatEngine.armor('e')}</span><span>Effects</span><span>${effTags(c.e.eff) || '-'}</span></div>

  // ---------------- Mesh ----------------
  function channelPanel() {
    const S = GameEngine.state, M = MeshProtocol.manager, cs = M.channelState(), GC = MeshProtocol.GAME_CHANNEL;
    const auto = S.settings.channelAuto !== false, gameIdx = M.client ? M.client.gameIdx : null;
    const status = {
      offline: `<span class="dim">Connect a radio - the app finds or creates the public <b>${GC}</b> channel on it.</span>`,
      configuring: '<span class="gold">Scanning radio channel slots...</span>',
      missing: `<span class="red">No ${GC} channel and no free slot. Remove a channel in your MeshCore app, then Rescan. Packets stay queued.</span>`,
      ok: `<b class="grn">${esc(cs.name || '')}</b> <span class="dim">slot ${cs.idx}</span> ${cs.game ? '<span class="tag cy">game channel</span>' : '<span class="tag gold">manual</span>'}${cs.idx === 0 ? ' <span class="tag red">Public - everyone sees game traffic</span>' : ''}`,
    }[cs.status];
    const chans = M.channelList().filter(c => !c.empty);
    const slotOpts = M.online() && !M.client.channelsSupported
      ? Array.from({ length: 8 }, (_, i) => ({ idx: i, name: 'slot ' + i }))
      : chans;
    const opts = [`<option value="auto" ${auto ? 'selected' : ''}>Auto - ${GC}${gameIdx != null ? ` (slot ${gameIdx})` : ''}</option>`]
      .concat(slotOpts.map(c => `<option value="${c.idx}" ${!auto && S.settings.channel === c.idx ? 'selected' : ''}>${c.idx} · ${esc(c.name || '(unnamed)')}${c.idx === 0 ? ' (all users)' : ''}</option>`)).join('');
    return `<h3 style="margin-top:12px">Game Channel</h3>
      <div class="kv"><span>Active</span><span>${status}</span>
      <span>Hashtag key</span><span class="hex">${U.hexBytes(MeshProtocol.GAME_KEY, '').toLowerCase()}</span></div>
      <div class="row" style="margin-top:8px"><label class="f">Send / receive on<select data-set="channelSel" ${M.online() ? '' : 'disabled'}>${opts}</select></label>
      <button class="btn" data-act="rescanChannels" ${M.online() && cs.status !== 'configuring' ? '' : 'disabled'}>Rescan / create ${GC}</button></div>
      <div class="sub" style="margin-top:6px">${GC} is a public hashtag channel: anyone can join it in a MeshCore app by adding the hashtag channel "${GC}" (key = first 16 bytes of SHA-256("${GC}")). Only messages on the active channel are read as game traffic.</div>`;
  }
  function presencePanel() {
    const S = GameEngine.state, M = MeshProtocol.manager, list = GameEngine.presenceList();

    const dot = st => `<span class="led ${st === 'online' ? 'on' : st === 'recent' ? 'q' : ''}"></span>`;
    const via = g => ({ room: 'room server', tab: 'local tab', dm: 'direct msg' }[g.source] || (String(g.source).startsWith('ch') ? 'radio ' + g.source : g.source));
    const row = x => {
      const g = x.g, ht = g.hull % HULLS.length;
      return `<div class="spread" style="padding:5px 0;border-bottom:1px solid rgba(29,58,90,.5);font-size:12px">
        <span class="row" style="gap:8px">${dot(x.status)}<b class="vio">${esc(GameEngine.ghostName(g.player))}</b><span class="dim">${HULLS[ht].name} · R${g.rating}</span></span>
        <span class="dim" style="text-align:right">${g.departed ? '<span class="red">signed off</span> ' : ''}${U.ago(x.age)}<br>${esc(via(g))}${g.hops != null ? ` · ${g.hops} hop${g.hops === 1 ? '' : 's'}` : ''}${g.snr != null ? ` · SNR ${g.snr}` : ''}</span></div>`;
    };
    const section = (title, arr) => (arr.length ? `<h3 style="margin-top:10px">${title} (${arr.length})</h3>${arr.map(row).join('')}` : '');
    const sims = GameEngine.presenceList(true).filter(x => GameEngine.isSim(x.g)).length;
    const hb = S.settings.heartbeat | 0;
    const you = M.online()
      ? `You are on the mesh · ${hb ? `heartbeat every ${hb} min` : 'heartbeat off'}${S.lastSigAt ? ` · last sent ${U.ago(U.now() - S.lastSigAt)}` : ''}`
      : 'You are off the mesh - connect a radio to appear to others';
    return `<div class="bevel panel"><h2>Captains on the Mesh</h2>
      <div class="row" style="gap:18px"><span><b class="grn" style="font-size:22px">${on.length}</b> <span class="dim">online</span></span><span><b class="gold" style="font-size:22px">${rec.length}</b> <span class="dim">recent</span></span><span class="sub">${dot(M.online() ? 'online' : 'offline')} ${you}</span></div>
      ${list.length ? section('Online', on) + section('Recently heard', rec) + section('Offline', off) : '<div class="sub" style="margin-top:8px">No real captains heard yet. Presence comes from ship-signature heartbeats on the game channel.</div>'}

      <div class="sub" style="margin-top:8px">Online = heard within ${GameEngine.PRESENCE_ONLINE / 60} min (tolerates one lost heartbeat), recent = within ${GameEngine.PRESENCE_RECENT / 3600} h. Times use the sender's timestamp, so room-server catch-up is dated correctly.</div></div>`;
  }

        <span>Tab loopback</span><span>${M.bc ? 'BroadcastChannel active' : 'unavailable'}</span>

        <div class="row" style="margin-top:10px"><button class="btn" data-act="connectSerial" ${MeshProtocol.SerialAdapter.supported() ? '' : 'disabled'}>USB Serial</button><button class="btn" data-act="connectBLE" ${MeshProtocol.BLEAdapter.supported() ? '' : 'disabled'}>Bluetooth LE</button>
        <button class="btn red" data-act="disconnect" ${M.online() ? '' : 'disabled'}>Disconnect</button><button class="btn" data-act="pollRoom" ${M.online() ? '' : 'disabled'}>Poll room</button><button class="btn gold" data-act="flush" ${M.online() && M.pending ? '' : 'disabled'}>Flush queue</button></div>
        ${channelPanel()}
        <div class="row" style="margin-top:10px">
        <label class="f">Heartbeat<select data-set="heartbeat">${[0, 5, 10, 15, 30, 60].map(m => `<option value="${m}" ${(S.settings.heartbeat | 0) === m ? 'selected' : ''}>${m ? m + ' min' : 'Off'}</option>`).join('')}</select></label>

        <label class="f">Room name filter<input data-set="roomFilter" value="${esc(S.settings.roomFilter)}" style="width:120px"></label>
        <label class="f">Sim peers<input data-set="simPeers" type="checkbox" ${S.settings.simPeers ? 'checked' : ''}></label></div>
        <pre class="hex" style="max-height:140px;overflow:auto;background:rgba(2,6,12,.6);padding:6px;margin-top:10px;white-space:pre-wrap">${esc(M.logLines.join('\n')) || 'Radio idle.'}</pre></div>
      <div class="bevel panel"><h2>Broadcast</h2><div class="sub">Ship signature (16B): <span class="hex">${U.hexBytes(sig)}</span> → <span class="hex">${MeshProtocol.encodeWire(sig)}</span></div>
        <div class="row" style="margin-top:8px"><button class="btn gold" data-act="broadcastSig">Broadcast signature</button></div>
        <h3 style="margin-top:12px">Market rumor (7B trade disturbance · 600cr)</h3>${cOpts ? `<div class="row"><select id="rumorC">${cOpts}</select><button class="btn" data-act="rumor" data-up="1">Spike ▲</button><button class="btn" data-act="rumor" data-up="0">Crash ▼</button></div>` : '<div class="sub">Dock at a market to spread rumors.</div>'}
        <h3 style="margin-top:12px">Outbound queue</h3><div id="outboxList" class="sub">Loading...</div></div></div>
      <div class="stack">${presencePanel()}<div class="bevel panel"><h2>Sector Bulletins</h2><div style="max-height:340px;overflow:auto">${bulls}</div></div>
        <div class="bevel panel"><h2>Ghost Fleet Registry</h2><div style="max-height:380px;overflow:auto">${ghosts}</div></div>
        <div class="bevel panel"><h2>Bounty Board</h2>${bounties}</div></div></div>`;
  }
  async function fillOutbox() {
    const el = U.$('#outboxList'); if (!el) return;
    const items = await StorageManager.all('outbox');
    el.innerHTML = items.length ? items.map(i => `<div class="spread"><span>${esc(i.label)}</span><span class="hex">${i.wire}</span></div>`).join('') : 'Queue empty.';
  }

  // ---------------- Log & config ----------------
  function viewLog() {
    const S = GameEngine.state, col = { trade: 'cy', combat: 'red', crew: 'grn', ship: 'gold', mesh: 'vio', nav: '' };
    return `<div class="grid2"><div class="bevel panel"><h2>Captain's Log</h2><div style="max-height:70vh;overflow:auto">${S.log.map(l => `<div class="bul"><span class="dim">${U.fmtTime(l.t)}</span> <span class="${col[l.type] || ''}">${esc(l.msg)}</span></div>`).join('')}</div></div>
      <div class="stack"><div class="bevel panel"><h2>Commander Profile</h2><div class="row"><label class="f">Callsign<input data-set="callsign" value="${esc(S.callsign)}" maxlength="24"></label><label class="f">Ship name<input data-set="shipName" value="${esc(S.ship.name)}" maxlength="28"></label></div>
        <div class="kv" style="margin-top:10px"><span>Kills</span><span>${S.kills}</span><span>Jumps</span><span>${S.jumps}</span><span>Aggression</span><span>${S.aggro}</span><span>Ship time offset</span><span>+${(S.timeOffset / 3600).toFixed(1)}h</span></div>
        <h3 style="margin-top:10px">Faction Standing</h3>${FACTIONS.map(F => `<div class="statline"><span style="color:${F.color}">${F.short}</span>${bar('', S.rep[F.id] + 100, 200)}<span>${S.rep[F.id]}</span></div>`).join('')}</div>
      <div class="bevel panel"><h2>Sector Seed</h2><div class="sub">Every captain sharing a 32-bit seed sees identical systems, lanes, factions and stardate-driven markets.</div>
        <div class="row" style="margin-top:8px"><input id="seedIn" value="${U.hex(S.seed)}" maxlength="10" style="width:120px"><button class="btn gold" data-act="reseedAsk">Re-seed galaxy</button></div></div>
      <div class="bevel panel"><h2>Audio</h2>${['master', 'sfx', 'music'].map(k => `<div class="statline"><span class="dim">${k.toUpperCase()}</span><input type="range" min="0" max="1" step="0.05" value="${AudioEngine.getVolume(k)}" data-vol="${k}"><span></span></div>`).join('')}</div>
      <div class="bevel panel"><h2>Offline / PWA</h2><div class="kv"><span>Storage</span><span>${StorageManager.usingIDB() ? 'IndexedDB (ship, crew, starmap, outbox, bulletins, meta)' : 'In-memory fallback'}</span><span>Service worker</span><span>${esc(StorageManager.swStatus())}</span></div>
        <p class="sub">All artwork is generated locally. Crew identities are seeded: humans, fin-crested Veyran, horned Kael and mechanical robots. Organic crew are mostly male, with some female officers; robots have sentinel or cyclops chassis. These cosmetic identities do not change skills or combat rules. Existing names and career progress are preserved. Uniform colors, equipment and insignia reflect crew roles. No images, fonts or audio assets are downloaded.</p>
        <div class="row" style="margin-top:8px"><button class="btn gold" data-act="tutorial">Restart tutorial</button><button class="btn" data-act="exportSW">Export sw.js</button>${installPrompt ? '<button class="btn gold" data-act="installApp">Install app</button>' : ''}<button class="btn red" data-act="wipeAsk">Wipe all data</button></div></div></div></div>`;
  }

  // ---------------- Rendering pipeline ----------------
  const VIEWS = { bridge: viewBridge, map: viewMap, ship: viewShip, crew: viewCrew, tactical: viewTactical, mesh: viewMesh, log: viewLog };
  function renderTop() {
    const S = GameEngine.state, st = GameEngine.shipStats(), sys = GameEngine.here(), M = MeshProtocol.manager;
    const led = M.online() ? 'on' : M.pending ? 'q' : S.settings.simPeers ? 'sim' : '';
    U.$('#top').innerHTML = `<div class="logo">${logoSVG}<div>MESH WARS<small>FRONTIER TRADERS</small></div></div><div class="chips">
      ${chip('Credits', U.fmt(S.credits), 'gold')}${chip('Hull', `${S.ship.hull}/${st.maxHull}`, S.ship.hull < st.maxHull * 0.35 ? 'red' : '')}${chip('Fuel', `${S.ship.fuel}/${st.fuel}`, S.ship.fuel < 2 ? 'red' : '')}
      ${chip('Cargo', `${GameEngine.cargoUsed()}/${st.cargo}`)}${chip('Loc', esc(sys.name) + ' · ' + U.roman(S.planet))}${chip('Stardate', U.fmtTime(GameEngine.worldTime()), 'cy', 'clock')}
      <div class="chip bevel" data-act="tab" data-tab="mesh" style="cursor:pointer"><span class="led ${led}"></span><span class="k">Mesh</span><b>${M.online() ? esc(M.transportLabel()) : S.settings.simPeers ? 'SIM' : 'OFF-GRID'}</b>${M.pending ? ` <span class="gold">⧗${M.pending}</span>` : ''} <span class="grn" title="Captains heard in the last ${GameEngine.PRESENCE_ONLINE / 60} min">● ${GameEngine.onlineCount()} online</span></div></div>
      <button class="iconbtn" data-act="tutorial" title="Interactive tutorial">? GUIDE</button><button class="iconbtn" id="fullscreenBtn" data-act="toggleFullscreen" aria-label="Enter fullscreen" aria-pressed="false">⛶ FULLSCREEN</button><button class="iconbtn ${AudioEngine.isMusic() ? '' : 'off'}" data-act="toggleMusic">♫ MUSIC</button><button class="iconbtn ${AudioEngine.isSfx() ? '' : 'off'}" data-act="toggleSfx">◉ SFX</button>`;
    syncFullscreenButton();
  }
  function renderTabs() {
    U.$('#tabs').innerHTML = TABS.map(([id, label]) => {
      const badge = id === 'mesh' && GameEngine.unread ? `<span class="badge">${GameEngine.unread}</span>` : id === 'tactical' && CombatEngine.c && !CombatEngine.c.over ? '<span class="badge">!</span>' : '';
      return `<button class="${tab === id ? 'active' : ''}" data-act="tab" data-tab="${id}">${label}${badge}</button>`;
    }).join('');
  }
  function renderView() {
    pendingView = false;
    const v = U.$('#view'), sc = v.scrollTop;
    v.innerHTML = VIEWS[tab]();
    v.scrollTop = sc;
    if (tab === 'bridge') { Planet.setPlanet(GameEngine.here(), GameEngine.herePlanet()); U.$('#planetSlot').prepend(Planet.cv); }
    if (tab === 'tactical') {
      const l = U.$('#clog'); if (l) l.scrollTop = l.scrollHeight;
      const c = CombatEngine.c; if (c && c.log.length) lastLogShown = c.log[c.log.length - 1].id;
    }
    if (tab === 'mesh') fillOutbox();
  }
  function doRender() {
    renderTop(); renderTabs();
    Space.setSystem(GameEngine.here());
    const ae = document.activeElement;
    if (ae && ae.closest && ae.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && ae.type !== 'checkbox' && ae.type !== 'range') { pendingView = true; return; }
    renderView();
  }
  function render() {
    if (!ready || renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; doRender(); });
  }
  function switchTab(t) { tab = t; if (t === 'mesh') GameEngine.unread = 0; render(); }
  function toast(msg, cls = 'cy') {
    const d = document.createElement('div');
    d.className = 'toast bevel'; d.innerHTML = `<span class="${cls}">${esc(msg)}</span>`;
    U.$('#toasts').appendChild(d);
    setTimeout(() => d.remove(), 3400);
  }
  function fx(side, color, hit) {
    const c = CombatEngine.c; if (!c) return;
    fxList.push({ from: { ...(side === 'p' ? c.p : c.e) }, to: { ...(side === 'p' ? c.e : c.p) }, color, hit, t: performance.now() });
    while (fxList.length > 12) fxList.shift();
    render();
  }
  function showModal(html, locked = true) { const m = U.$('#modal'); U.$('#modalBox').innerHTML = html; m.classList.add('on'); m.dataset.locked = locked ? '1' : ''; }
  function closeModal() { U.$('#modal').classList.remove('on'); }
  function showConfirm(text, act, data = {}) {
    const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
    showModal(`<h2 class="gold" style="letter-spacing:.2em">CONFIRM</h2><p>${esc(text)}</p><div class="row"><button class="btn red" data-act="${act}" ${attrs}>Confirm</button><button class="btn" data-act="closeModal">Cancel</button></div>`, false);
  }

  // ---------------- Navigation, encounters, combat results ----------------
  let pendingEnemy = null;
  function doJump(target) {
    if (warpLock) return;
    if (CombatEngine.c) return GameEngine.fail('Disengage from combat first');
    const res = GameEngine.jump(target);
    if (res.err) return GameEngine.fail(res.err);
    warpLock = true;
    AudioEngine.play('warp'); Space.startWarp();
    setTimeout(() => {
      const f = U.$('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120);
      mapSel = GameEngine.state.system; render();
    }, 1500);
    setTimeout(() => { warpLock = false; if (res.enc) showEncounter(res.enc); else toast(`Arrived at ${GameEngine.here().name}`, 'cy'); }, 1900);
  }
  function showEncounter(enc) {
    currentEnc = enc;
    const info = GameEngine.encounterInfo(enc);
    const art = enc.type === 'ghost' ? shipSVG(enc.ghost.hull % HULLS.length, enc.ghost.player, { accent: '#b07cff', tint: '#6a5a8a', flip: true, slots: ghostShipSlots(enc.ghost) }) : scanSVG;
    AudioEngine.play(enc.type === 'merchant' || enc.type === 'derelict' ? 'alert' : 'klaxon');
    showModal(`<h2 style="color:${enc.type === 'merchant' || enc.type === 'derelict' ? 'var(--cy)' : 'var(--red)'};letter-spacing:.2em">${esc(info.title)}</h2>
      <div class="svgfit" style="max-width:340px;margin:8px auto">${art}</div><p>${esc(info.text)}</p>
      <div class="row">${info.options.map(([a, l]) => `<button class="btn ${a === 'fight' ? 'red' : a === 'ignore' ? '' : 'gold'}" data-act="encChoice" data-a="${a}">${esc(l)}</button>`).join('')}</div>`);
  }
  function resolveEnc(a) {
    if (!currentEnc) return;
    const info = GameEngine.encounterInfo(currentEnc), res = GameEngine.resolveEncounter(currentEnc, a);
    currentEnc = null;
    GameEngine.changed();
    if (res.combat && !res.text) { closeModal(); CombatEngine.start(res.combat); return; }
    pendingEnemy = res.combat || null;
    showModal(`<h2 class="cy" style="letter-spacing:.2em">${esc(info.title)}</h2><p>${esc(res.text)}</p>${res.roll ? `<div style="margin:8px 0">${Dice.html(res.roll)} → <b>${res.roll.hits}</b> success(es)</div>` : ''}
      <div class="row">${pendingEnemy ? '<button class="btn red" data-act="startFight">Battle stations!</button>' : '<button class="btn gold" data-act="closeModal">Continue</button>'}</div>`);
  }
  function combatOver(c) {
    const title = { victory: 'VICTORY', captured: 'VESSEL CAPTURED', defeat: 'SHIP DISABLED', fled: 'ESCAPED', enemyFled: 'ENEMY RETREATED' }[c.result];
    const good = c.result !== 'defeat';
    render();
    setTimeout(() => showModal(`<h2 class="${good ? 'gold' : 'red'}" style="letter-spacing:.3em">${title}</h2><div class="svgfit" style="max-width:300px;margin:auto">${shipSVG(c.enemy.hullType, c.enemy.seed, { accent: good ? '#ffb547' : '#ff4d5e', tint: '#555', flip: true, slots: combatShipSlots(c.enemy) })}</div>
      <ul class="sub">${c.summary.map(s => `<li>${s}</li>`).join('')}</ul><div class="row"><button class="btn gold" data-act="combatDone">Return to bridge</button></div>`), 700);
  }

  // ---------------- Actions (event delegation) ----------------
  const actions = {
    async toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else toast('Fullscreen is not supported by this browser.', 'gold');
      } catch (e) { toast('Could not change fullscreen mode.', 'gold'); }
    },
    toggleMusic() { AudioEngine.toggleMusic(); render(); },
    toggleSfx() { AudioEngine.toggleSfx(); render(); },
    tab(d) { switchTab(d.tab); },
    gotoPlanet(d) { GameEngine.travelPlanet(+d.p); },
    buy(d) { GameEngine.buy(+d.c, +d.q); },
    sell(d) { GameEngine.sell(+d.c, +d.q); },
    refuel() { GameEngine.refuel(); },
    repair() { GameEngine.repair(); },
    rest() { GameEngine.restCrew(); },
    selSys(d) { mapSel = +d.s; if (tab !== 'map') switchTab('map'); else render(); },
    plot(d) {
      const r = GameEngine.route(+d.s);
      if (!r.length) return GameEngine.fail('No route available');
      GameEngine.state.route = r; mapSel = +d.s;
      toast(`Route plotted: ${r.length} jump(s) to ${GameEngine.sys(+d.s).name}`, 'cy');
      GameEngine.changed();
    },
    jumpTo(d) { doJump(+d.s); },
    jumpNext() { const r = GameEngine.state.route; if (r.length) doJump(r[0]); },
    install(d) { GameEngine.buyModule(d.k, d.id); },
    uninstall(d) { GameEngine.sellModule(d.k, +d.i); },
    buyHull(d) { GameEngine.buyHull(+d.h); },
    hire(d) { GameEngine.hire(d.id); },
    dismiss(d) { GameEngine.dismiss(d.id); },
    drill(d) { if (!CombatEngine.c) CombatEngine.start(GameEngine.makeEnemy('drill', { tier: +d.t })); },
    move(d) { CombatEngine.move(+d.x, +d.y); },
    fire(d) { CombatEngine.fire(+d.i); },
    talent(d) { CombatEngine.useTalent(d.id); },
    board() { CombatEngine.board(); },
    flee() { CombatEngine.flee(); },
    endTurn() { CombatEngine.endTurn(); },
    crewAct(d) {
      const c = CombatEngine.c, b = c && c.boarding; if (!b) return;
      const A = CREW_ACTS[d.a];
      if (A.target === 'none') CombatEngine.playerCrewAction(d.a, null);
      else { b.sel = b.sel === d.a ? null : d.a; render(); }
    },
    crewTarget(d) { const b = CombatEngine.c && CombatEngine.c.boarding; if (b) CombatEngine.playerCrewAction(b.sel || 'strike', d.u); },
    withdraw() { CombatEngine.withdraw(); },
    async connectSerial() { try { await MeshProtocol.manager.connect('serial'); toast('MeshCore radio linked over USB serial', 'grn'); AudioEngine.play('confirm'); } catch (e) { GameEngine.fail('Serial: ' + e.message); } },
    async connectBLE() { try { await MeshProtocol.manager.connect('ble'); toast('MeshCore radio linked over Bluetooth', 'grn'); AudioEngine.play('confirm'); } catch (e) { GameEngine.fail('Bluetooth: ' + e.message); } },
    async disconnect() { await MeshProtocol.manager.disconnect(); },
    pollRoom() { MeshProtocol.manager.pollRoom(); },
    rescanChannels() { MeshProtocol.manager.rescanChannels(); },
    tutorial() { closeModal(); Tutorial.start(0); },
    flush() { MeshProtocol.manager.flush(); },
    broadcastSig() { GameEngine.broadcastSignature(false); },
    rumor(d) { const sel = U.$('#rumorC'); if (sel) GameEngine.spreadRumor(+sel.value, d.up === '1'); },
    postBounty(d) { const inp = U.$('#bnt-' + d.h); GameEngine.postBounty(+d.p >>> 0, inp ? +inp.value : 0); },
    reseedAsk() {
      const v = U.$('#seedIn').value.trim().replace(/^0x/i, '');
      if (!/^[0-9a-f]{1,8}$/i.test(v)) return GameEngine.fail('Seed must be 1-8 hex digits');
      showConfirm(`Re-seed the galaxy to 0x${U.hex(parseInt(v, 16))}? This starts a new career; bulletins and ghost registry are kept.`, 'reseed', { seed: parseInt(v, 16) >>> 0 });
    },
    async reseed(d) {
      await GameEngine.resetWorld(+d.seed >>> 0, GameEngine.state.callsign);
      closeModal(); mapSel = null; CombatEngine.c = null;
      toast(`Galaxy re-seeded: 0x${U.hex(+d.seed)}`, 'gold'); AudioEngine.play('warp'); Space.startWarp();
      switchTab('bridge');
    },
    wipeAsk() { showConfirm('Erase ALL local data (save, crew, starmap, outbox, bulletins) and reload?', 'wipe'); },
    async wipe() { GameEngine.frozen = true; clearTimeout(GameEngine.saveTimer); await StorageManager.wipe(); location.reload(); },
    exportSW() { StorageManager.exportServiceWorker(); toast('sw.js exported - place it beside index.html', 'cy'); },
    async installApp() { if (installPrompt) { installPrompt.prompt(); try { await installPrompt.userChoice; } catch (e) { /* dismissed */ } installPrompt = null; render(); } },
    encChoice(d) { resolveEnc(d.a); },
    closeModal() { closeModal(); },
    startFight() { closeModal(); if (pendingEnemy) CombatEngine.start(pendingEnemy); pendingEnemy = null; },
    combatDone() { closeModal(); CombatEngine.close(); switchTab('bridge'); },
    async launch() {
      const name = (U.$('#cmdName').value || 'Captain').trim().slice(0, 24) || 'Captain';
      const v = U.$('#cmdSeed').value.trim().replace(/^0x/i, '');
      const seed = /^[0-9a-f]{1,8}$/i.test(v) ? parseInt(v, 16) >>> 0 : 0xA9F3C104;
      await GameEngine.resetWorld(seed, name);
      GameEngine.fresh = false;
      closeModal();
      AudioEngine.init(); if (!AudioEngine.isMusic()) AudioEngine.toggleMusic();
      AudioEngine.play('warp'); Space.startWarp();
      toast(`Welcome aboard, Captain ${name}.`, 'gold');
      switchTab('bridge');
      setTimeout(() => Tutorial.start(0), 1800);
    },
  };
  function syncFullscreenButton() {
    const button = U.$('#fullscreenBtn');
    if (!button) return;
    const active = !!document.fullscreenElement;
    button.textContent = active ? '⛶ EXIT FULLSCREEN' : '⛶ FULLSCREEN';
    button.title = active ? 'Exit fullscreen' : 'Enter fullscreen';
    button.setAttribute('aria-label', button.title);
    button.setAttribute('aria-pressed', String(active));
  }
  function setSetting(key, el) {
    const S = GameEngine.state;
    switch (key) {
      case 'heartbeat': S.settings.heartbeat = U.clamp(parseInt(el.value, 10) || 0, 0, 120); GameEngine.heartbeatTick(); break;
      case 'channelSel':
        if (el.value === 'auto') S.settings.channelAuto = true;
        else { S.settings.channelAuto = false; S.settings.channel = U.clamp(parseInt(el.value, 10) || 0, 0, 63); }
        MeshProtocol.manager.log(`Game traffic now on ${S.settings.channelAuto ? MeshProtocol.GAME_CHANNEL + ' (auto)' : 'channel slot ' + S.settings.channel}`);
        MeshProtocol.manager.flush();
        break;
      case 'roomPassword': S.settings.roomPassword = el.value; break;
      case 'roomFilter': S.settings.roomFilter = el.value.trim(); break;
      case 'simPeers': S.settings.simPeers = el.checked; if (el.checked) { S.simBucket = -1; GameEngine.simTick(); } break;
      case 'callsign': {
        S.callsign = el.value.trim().slice(0, 24) || 'Captain';
        const cap = S.crew.find(c => c.job === 'Captain'); if (cap) cap.name = S.callsign;
        break;
      }
      case 'shipName': S.ship.name = el.value.trim().slice(0, 28) || 'ISV Wayfarer'; break;
    }
    GameEngine.changed();
  }
  function commissionModal() {
    showModal(`<h2 class="gold" style="letter-spacing:.3em">COMMISSION</h2>
      <div class="svgfit" style="max-width:420px;margin:auto">${shipSVG(GameEngine.state.ship.hullType, GameEngine.state.playerHash, { accent: '#38d9ff', slots: GameEngine.state.ship.modules })}</div>
      <p class="sub">The frontier is fractured between five powers. Trade, fight and parley your way across a galaxy derived from a shared 32-bit sector seed. Other captains reach you through the LoRa mesh as ghost fleets, bounties and market shocks.</p>
      <div class="row"><label class="f">Callsign<input id="cmdName" value="Captain" maxlength="24"></label><label class="f">Sector seed (hex)<input id="cmdSeed" value="A9F3C104" maxlength="10"></label></div>
      <div class="row" style="margin-top:12px"><button class="btn gold" data-act="launch">Launch career ➤</button></div>`);
  }

  function init() {
    Space.init();
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      const fn = actions[el.dataset.act];
      if (!fn) return;
      if (!['move', 'fire', 'buy', 'sell', 'encChoice'].includes(el.dataset.act)) AudioEngine.play('click');
      fn(el.dataset, el);
    });
    document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.set) setSetting(el.dataset.set, el); });
    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.vol) AudioEngine.setVolume(el.dataset.vol, +el.value); });
    document.addEventListener('focusout', () => setTimeout(() => { if (pendingView) render(); }, 60));
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'Escape' && U.$('#modal').classList.contains('on') && !U.$('#modal').dataset.locked) closeModal();
      if (tab === 'tactical' && CombatEngine.c) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); CombatEngine.endTurn(); }
        const n = parseInt(e.key, 10); if (n >= 1 && n <= 5) CombatEngine.fire(n - 1);
      }
    });
    const firstGesture = () => {
      AudioEngine.init();
      if (!AudioEngine.isMusic() && !GameEngine.fresh) AudioEngine.toggleMusic();
      render();
      window.removeEventListener('pointerdown', firstGesture);
    };
    window.addEventListener('pointerdown', firstGesture);
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; render(); });
    setInterval(() => { const c = U.$('#clock'); if (c && GameEngine.state) c.textContent = U.fmtTime(GameEngine.worldTime()); }, 1000);
    ready = true;
    Space.setSystem(GameEngine.here());
    render();
    if (GameEngine.fresh) commissionModal();
  }

  return { init, render, toast, switchTab, fx, combatOver, shipSVG, avatarSVG, characterTraits, Space, Planet };
})();

// ============================================================================
// Tutorial: guided, objective-driven tour with spotlight + instruction card
// ============================================================================
const Tutorial = (() => {
  let idx = -1, active = false, base = {}, latched = false, timer = null, renderedKey = '', advanceT = null;
  const $ = s => document.querySelector(s);
  const panelOf = sel => () => { const e = $(sel); return e ? e.closest('.panel') || e : null; };
  const panelByTitle = title => () => Array.from(document.querySelectorAll('#view .panel h2')).find(h => h.textContent.includes(title))?.closest('.panel') || null;
  const combat = () => CombatEngine.c;

  const STEPS = [
    { title: 'Welcome aboard, Captain', text: 'MESH WARS is a frontier trading and tactics game. Every captain sharing the same <b>sector seed</b> flies through the same galaxy, and other players reach you over the <b>MeshCore LoRa mesh</b> as ghost fleets, bounties and market shocks.<br><br>This guide takes about five minutes. You can leave at any time and restart it from the <b>? GUIDE</b> button.' },
    { tab: 'bridge', target: '#top .chips', title: 'Command Strip', text: '<b class="gold">Credits</b> buy cargo, fuel and refits. <b>Hull</b> is your ship\'s life, <b>Fuel</b> powers jumps, <b>Cargo</b> is hold space. The <b class="cy">Stardate</b> is real time plus the time you spend travelling. The <b>Mesh</b> chip shows your radio link and how many captains are online.' },
    { tab: 'bridge', target: '#planetSlot', title: 'The Bridge', text: 'You are in orbit. Each system has several worlds with different markets, shipyards and cantinas. Use the buttons under the planet to move between worlds in the same system (costs 2 hours, no fuel).' },
    { tab: 'bridge', target: panelOf('#view table.data'), title: 'Commodity Exchange', text: 'Planets <span class="grn">produce</span> some goods cheaply and <span class="red">consume</span> others at a premium. Prices drift with the stardate (▲▼ trend), and <span class="cy">ϟ</span> marks a market disturbance received over the mesh.',
      objective: 'Buy at least 1 unit of any commodity (+1 button).', init: () => ({ cargo: GameEngine.cargoUsed() }), check: b => GameEngine.cargoUsed() > b.cargo },
    { tab: 'bridge', target: panelOf('#view table.data'), title: 'Buy Low, Sell High', text: 'Haul that cargo to a world that consumes it and sell for profit. Large trades (15+ units) move prices for everyone and broadcast a disturbance packet. <b class="red">Illicit</b> goods sell high but patrols confiscate them.' },
    { tab: 'map', target: () => $('#view .svgfit')?.closest('.panel'), title: 'Star Map', text: 'Coloured clouds are faction territory. <span class="cy">Dashed cyan lanes</span> lead from your system; <span class="red">pulsing rings</span> are war fronts (dangerous but lucrative). <span class="vio">◆</span> marks ghost fleets of other players and <span class="gold">⌖</span> marks bounties.<br><br>Click a system connected by a cyan lane, then press <b class="gold">Jump</b> in the panel on the right.',
      objective: 'Make one hyperspace jump.', init: () => ({ jumps: GameEngine.state.jumps }), check: b => GameEngine.state.jumps > b.jumps },
    { tab: 'bridge', target: () => $('#view .kv')?.closest('.panel'), title: 'Arrival & Encounters', text: 'Jumps cost fuel and ship-time. On arrival you may meet pirates, patrols, merchants, derelicts or <span class="vio">ghost fleets</span>, AI replicas of real mesh players. Danger rises in lawless space and on war fronts. <b>Refuel</b> and <b>Repair</b> under Port Services.' },
    { tab: 'ship', target: () => $('#view .svgfit')?.closest('.panel'), title: 'Your Ship', text: 'The schematic shows <span class="red">weapon hardpoints (W)</span> and <span class="grn">utility bays (U)</span>. Lasers strip shields, railguns pierce armor, plasma hits hard up close, torpedoes reach far. At a <b>shipyard</b> you can install modules or trade up to a bigger hull.' },
    { tab: 'crew', target: '#view .crewcard', title: 'Your Crew', text: 'Officers have <b>skills</b> that feed dice pools (Gunnery for volleys, Piloting for evasion and escapes, Engineering for shields). Each job brings a <span class="gold">ship talent</span> with a cooldown and a <span class="cy">boarding action</span>. Hire more at cantinas; they level up with experience.' },
    { tab: 'tactical', target: '[data-act=drill][data-t="1"]', title: 'Tactical Training', text: 'Let\'s fight. A holographic drill is a safe battle: your hull and crew are restored afterwards.',
      objective: 'Launch the Cadet Drill.', check: () => !!combat() },
    { tab: 'tactical', target: () => $('#view .tacgrid .svgfit'), title: 'The Tactical Grid', text: 'You have <b class="gold">3 Action Points</b> each turn. Click a highlighted cell to move (1 AP). Each weapon has a range band; the <b class="gold">R</b> number on the dashed line is the current distance. Violet nebulae add evasion and rocks block movement.<br><br>Close in until a weapon shows <span class="grn">IN RANGE</span>, then press it to fire.',
      objective: 'Damage the enemy\'s shields or hull.', check: () => { const c = combat(); return !!c && (c.enemy.hull < c.enemy.maxHull || c.enemy.shield < c.enemy.maxShield || c.over); } },
    { tab: 'tactical', target: panelOf('[data-act=talent]'), title: 'Dice Pools & Talents', text: 'Every volley rolls a pool of d6: <b>2 + Gunnery/2 + weapon accuracy</b>. Dice at or above the <b>TN</b> hit, and 6s are crits. Watch the Combat Log.<br><br>Officer talents cost 1 AP and then cool down: <span class="gold">Target Lock</span> adds 3 dice, <span class="gold">Evasive Maneuvers</span> makes you hard to hit, and so on. When out of AP, press <b class="gold">End Turn</b> (or Space).',
      objective: 'End your turn and survive the enemy\'s reply.', check: () => { const c = combat(); return !!c && (c.turn >= 2 || c.over); } },
    { tab: 'tactical', target: () => $('[data-act=board]')?.closest('.panel'), title: 'Board or Flee', text: 'At range 1 you can <b>Board</b> (2 AP) to start crew-to-crew combat: capturing a ship pays 1.8x loot and a salvaged weapon. From the left edge, or at range 5+, you can try to <b>Flee</b>.<br><br>Finish the drill, or continue the guide and finish it later.' },
    { tab: 'mesh', target: panelByTitle('MeshCore Uplink'), title: 'The Mesh Uplink', text: 'Connect a <b>MeshCore companion radio</b> by USB Serial or Bluetooth. The game finds or creates the public <b class="cy">#meshwars</b> hashtag channel on it. Packets you generate wait in the outbox while you are off-grid and are sent when you reconnect. Without a radio, <span class="vio">simulated peers</span> keep the sector alive.' },
    { tab: 'mesh', target: panelByTitle('Captains on the Mesh'), title: 'Captains on the Mesh', text: 'Your ship signature is broadcast as a heartbeat, so others see you online. Captains heard in the last 35 minutes are <span class="grn">online</span>. Below are <b>Sector Bulletins</b>, the <b>Ghost Fleet Registry</b> (where you can post bounties) and the <b>Bounty Board</b>. Defeat a ghost with a bounty on it to claim the reward.' },
    { tab: 'log', target: () => $('#seedIn')?.closest('.panel'), title: 'Captain\'s Log & Config', text: 'Your log records every trade, jump and battle. Share a <b>sector seed</b> with friends to fly in the same galaxy. Audio levels and offline/PWA options live here too.' },
    { title: 'Ready for the frontier', text: 'That\'s the essentials. A starter tip: buy what this world <span class="grn">produces</span>, jump to a neighbour that <span class="red">consumes</span> it, and keep fuel for the trip home. Here are <b class="gold">2,000 credits</b> to get you started.<br><br>Fair winds, Captain.', final: true },
  ];

  function el(id, cls) {
    let e = document.getElementById(id);
    if (!e) { e = document.createElement('div'); e.id = id; if (cls) e.className = cls; document.body.appendChild(e); }
    return e;
  }
  function target(step) {
    if (!step.target) return null;
    const t = typeof step.target === 'function' ? step.target() : $(step.target);
    return t && t.getClientRects().length ? t : null;
  }
  function persist() {
    const S = GameEngine.state; if (!S) return;
    S.tutorial = { ...(S.tutorial || {}), step: idx, done: !!(S.tutorial && S.tutorial.done), skipped: !!(S.tutorial && S.tutorial.skipped) };
    GameEngine.save();
  }
  function objectiveDone() {
    const step = STEPS[idx];
    if (!step.check) return true;
    if (!latched && step.check(base)) { latched = true; AudioEngine.play('confirm'); }
    return latched;
  }
  function enter(i) {
    clearTimeout(advanceT);
    idx = U.clamp(i, 0, STEPS.length - 1); latched = false; renderedKey = '';
    const step = STEPS[idx];
    base = step.init ? step.init() : {};
    // don't pull the player away from a live (non-tutorial) battle
    if (step.tab && !(combat() && step.tab !== 'tactical')) ArtAndUIController.switchTab(step.tab);
    persist();
    setTimeout(() => { const t = target(step); if (t) t.scrollIntoView({ block: 'center', behavior: 'smooth' }); refresh(); }, 120);
  }
  function cardHTML(step, done) {
    const prog = `${idx + 1} / ${STEPS.length}`;
    const obj = step.objective ? `<div class="bul ${done ? 'trade' : 'bounty'}" style="margin-top:10px"><b class="${done ? 'grn' : 'gold'}">${done ? '✔ Objective complete' : '◇ Objective'}</b><br>${step.objective}</div>` : '';
    const nextLabel = step.final ? 'Finish ✔' : idx === 0 ? 'Start the tour ➤' : step.objective && !done ? 'Skip step' : 'Next ➤';
    return `<div class="spread"><span class="dim" style="font-size:10px;letter-spacing:.25em">FLIGHT SCHOOL · ${prog}</span><button class="iconbtn off" data-tut="close" title="Exit tutorial">✕</button></div>
      <h3 class="cy" style="margin:6px 0 8px;letter-spacing:.15em;text-transform:uppercase;font-size:13px">${step.title}</h3>
      <div class="sub" style="color:var(--txt);line-height:1.55">${step.text}</div>${obj}
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <span>${idx > 0 && !step.final ? '<button class="btn sm" data-tut="back">‹ Back</button>' : ''}${idx === 0 ? '<button class="btn sm" data-tut="close">Skip tutorial</button>' : ''}</span>
        <button class="btn sm ${step.objective && !done ? '' : 'gold'}" data-tut="next">${nextLabel}</button></div>`;
  }
  function refresh() {
    if (!active || idx < 0) return;
    const step = STEPS[idx], spot = el('tutSpot'), card = el('tutCard', 'bevel');
    // combat-only steps fall through when the battle has ended and been closed
    if (step.tab === 'tactical' && idx > 9 && !combat()) { enter(STEPS.findIndex(s => s.tab === 'mesh')); return; }
    if (U.$('#modal').classList.contains('on')) { spot.style.display = 'none'; card.style.display = 'none'; return; }
    const done = objectiveDone();
    const key = idx + ':' + done;
    if (key !== renderedKey) {
      card.innerHTML = cardHTML(step, done); renderedKey = key;
      if (done && step.objective) advanceT = setTimeout(() => { if (active && STEPS[idx] === step) enter(idx + 1); }, 1500);
    }
    card.style.display = 'block'; spot.style.display = 'block';
    const t = target(step), vw = innerWidth, vh = innerHeight, cw = card.offsetWidth, ch = card.offsetHeight, pad = 6;
    if (!t) {
      Object.assign(spot.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px', borderWidth: '0px' });
      Object.assign(card.style, { left: (vw - cw) / 2 + 'px', top: Math.max(12, (vh - ch) / 2) + 'px' });
      return;
    }
    const r = t.getBoundingClientRect();
    Object.assign(spot.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px', borderWidth: '2px' });
    // try beside the target first, then the corners; pick the placement that hides the least of it
    const m = 12, gap = 14, cands = [
      [r.left, r.bottom + gap], [r.left, r.top - ch - gap], [r.right + gap, r.top], [r.left - cw - gap, r.top],
      [vw - cw - m, vh - ch - m], [m, vh - ch - m], [vw - cw - m, m + 60], [m, m + 60],
    ].map(([x, y]) => [U.clamp(x, m, vw - cw - m), U.clamp(y, m, vh - ch - m)]);
    const overlap = ([x, y]) => Math.max(0, Math.min(x + cw, r.right) - Math.max(x, r.left)) * Math.max(0, Math.min(y + ch, r.bottom) - Math.max(y, r.top));
    let best = cands[0], bo = Infinity;
    for (const c of cands) { const o = overlap(c); if (o < bo - 1) { bo = o; best = c; } if (o === 0) break; }
    Object.assign(card.style, { left: best[0] + 'px', top: best[1] + 'px' });
  }
  function finish(skipped) {
    const S = GameEngine.state;
    active = false; clearInterval(timer); clearTimeout(advanceT);
    el('tutSpot').style.display = 'none'; el('tutCard').style.display = 'none';
    S.tutorial = { ...(S.tutorial || {}), step: idx, done: !skipped, skipped: !!skipped };
    if (!skipped && !S.tutorial.rewarded) {
      S.tutorial.rewarded = true; S.credits += 2000;
      GameEngine.log('Flight school complete: 2,000cr training stipend', 'trade');
      ArtAndUIController.toast('Tutorial complete! +2,000 credits', 'gold'); AudioEngine.play('victory');
    } else if (skipped) ArtAndUIController.toast('Tutorial closed - reopen it any time with ? GUIDE', 'cy');
    GameEngine.changed();
  }
  function start(from = 0) {
    active = true;
    clearInterval(timer); timer = setInterval(refresh, 350);
    enter(from);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-tut]'); if (!b) return;
    AudioEngine.play('click');
    const a = b.dataset.tut;
    if (a === 'close') finish(true);
    else if (a === 'back') enter(idx - 1);
    else if (a === 'next') { if (STEPS[idx].final) finish(false); else enter(idx + 1); }
  });
  addEventListener('resize', refresh);
  return {
    start, refresh,
    isActive: () => active,
    // offered automatically once for captains who have never finished or dismissed it
    resumeIfPending() {
      const t = GameEngine.state.tutorial;
      if (!t || (!t.done && !t.skipped)) start(t && t.step > 0 && t.step < STEPS.length ? t.step : 0);
    },
  };
})();

// ============================================================================
// Bootstrap
// ============================================================================
(async function boot() {
  await StorageManager.init();
  StorageManager.installManifest();
  await GameEngine.load();
  MeshProtocol.manager.init({
    onPacket: (p, bytes, src, meta) => GameEngine.applyPacket(p, bytes, src, meta),
    onStatus: () => ArtAndUIController.render(),
    settings: () => GameEngine.state.settings,
    onConnected: () => GameEngine.broadcastSignature(true),
    onDisconnecting: () => GameEngine.signOff(),
  });
  GameEngine.simTick();
  ArtAndUIController.init();
  if (!GameEngine.fresh) Tutorial.resumeIfPending();
  StorageManager.registerServiceWorker().then(() => ArtAndUIController.render());
  setInterval(() => { GameEngine.simTick(); GameEngine.prune(); }, 60000);
  setInterval(() => { GameEngine.heartbeatTick(); ArtAndUIController.render(); }, 30000);
  window.addEventListener('pagehide', () => { if (!GameEngine.frozen) GameEngine.signOff(); });
  window.addEventListener('beforeunload', () => { GameEngine.saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) GameEngine.saveNow(); });
})();
</script>
</body>
</html>
